  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1017; font-family: 'Press Start 2P', monospace; color: #fff; display: flex; justify-content: center; align-items: center; }
    #game-container { position: relative; width: 100%; max-width: 440px; height: 100%; max-height: 840px; aspect-ratio: 9/16; background: #000; box-shadow: 0 12px 36px rgba(0,0,0,0.85); overflow: hidden; display: flex; flex-direction: column; }
    @media (min-width: 480px) and (min-height: 600px) { #game-container { height: 94vh; border: 4px solid #2e384d; border-radius: 16px; } }
    @media (max-width: 480px) or (max-height: 600px) { body { padding: 0; } #game-container { width: 100vw; height: 100vh; max-height: 100vh; max-width: 100vw; border: none; border-radius: 0; } }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; pointer-events: auto; }
    .icon-btn { background: #1e2638; border: 2px solid #54a0ff; color: #fff; font-family: inherit; font-size: 9px; padding: 8px 10px; border-radius: 6px; cursor: pointer; box-shadow: 0 4px #0f1420; outline: none; }
    .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px #0f1420; }
    .badge { background: rgba(15,20,32,0.92); border: 2px solid #fbc531; border-radius: 20px; padding: 6px 12px; font-size: 10px; color: #fbc531; display: flex; align-items: center; gap: 6px; text-shadow: 1px 1px #000; box-shadow: 0 4px #0f1420; }
    .crt-overlay { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%); background-size: 100% 4px; opacity: 0.4; z-index: 5; }
    .modal { position: absolute; inset: 0; background: rgba(12, 16, 26, 0.96); display: none; flex-direction: column; align-items: center; padding: 20px 16px; pointer-events: auto; z-index: 100; overflow-y: auto; }
    .modal.active { display: flex; }
    .close-btn { margin-top: auto; width: 100%; padding: 12px; font-size: 10px; background: #ff4757; border: 2px solid #c23616; color: #fff; font-family: inherit; border-radius: 6px; cursor: pointer; box-shadow: 0 4px #8b1800; }
  </style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="360" height="640"></canvas>
  <div class="crt-overlay"></div>
  <div class="ui-overlay">
    <div class="top-bar">
      <div class="badge"><span>🐟</span><span id="fish-count">0</span></div>
      <div style="display:flex; gap:6px;">
        <button class="icon-btn" id="btn-meow">🐱 MEOW</button>
        <button class="icon-btn" id="btn-sound">🔊</button>
      </div>
    </div>
  </div>
</div>

ctx.imageSmoothingEnabled = false;

// Audio
class SoundSys {
  constructor() {
    this.ctx = null; this.on = true;
  }
  ensure() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  tone(f, type, d, v=0.25, endV=0.001, bend=null) {
    if (!this.on) return; this.ensure();
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime;
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (bend) osc.frequency.exponentialRampToValueAtTime(Math.max(10, bend), t+d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(endV, t+d);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t+d);
  }
  swat() { this.tone(500, 'sine', 0.12, 0.3, 0.01, 140); }
  smash() { this.tone(200, 'sawtooth', 0.2, 0.35, 0.01, 40); setTimeout(()=>this.tone(900, 'square', 0.08, 0.2, 0.01, 400), 40); }
  meow() {
    if (!this.on) return; this.ensure();
    const t = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(450, t); osc.frequency.linearRampToValueAtTime(820, t+0.12); osc.frequency.exponentialRampToValueAtTime(400, t+0.32);
    g.gain.setValueAtTime(0.25, t); g.gain.linearRampToValueAtTime(0.3, t+0.1); g.gain.exponentialRampToValueAtTime(0.01, t+0.32);
    osc.connect(g); g.connect(this.ctx.destination); osc.start(t); osc.stop(t+0.33);
  }
  frenzy() { [523, 659, 783, 1046, 1318].forEach((f, i) => setTimeout(() => this.tone(f, 'square', 0.1, 0.15, 0.01), i*60)); }
}
const audio = new SoundSys();

class KnockGame {
  constructor() {
    this.state = 'MENU';
    this.score = 0;
    this.bestScore = parseInt(localStorage.getItem('miele_knock_best') || '0', 10);
    this.fishCount = parseInt(localStorage.getItem('fc_fishCount') || '0', 10);
    this.fishesThisRun = 0;
    this.lives = 5;
    this.tableY = 410;
    this.catX = 140;
    this.isSwatting = false;
    this.swatTimer = 0;
    this.items = [];
    this.itemSpawnTimer = 0.5;
    this.particles = [];
    this.floatingTexts = [];
    this.zoomiesMeter = 0;
    this.zoomiesActive = false;
    this.zoomiesTimer = 0;
    this.time = 0;
    this.shake = 0;
    this.init();
  }

  init() {
    document.getElementById('btn-sound').addEventListener('click', (e) => {
      e.stopPropagation(); audio.on = !audio.on;
      document.getElementById('btn-sound').textContent = audio.on ? '🔊' : '🔇';
    });
    document.getElementById('btn-meow').addEventListener('click', (e) => {
      e.stopPropagation(); audio.meow();
      this.spawnText(this.catX+40, this.tableY-40, 'MEOW! 🐾', '#ff78cb');
    });

    const doAction = (e) => {
      if (e) e.preventDefault();
      audio.ensure();
      if (this.state === 'MENU' || this.state === 'GAMEOVER') {
        this.startRun();
      } else if (this.state === 'PLAYING') {
        this.swat();
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') doAction(e);
    });
    canvas.addEventListener('pointerdown', doAction);
    this.updateHUD();
  }

  updateHUD() {
    document.getElementById('fish-count').textContent = this.fishCount;
  }

  startRun() {
    this.state = 'PLAYING';
    this.score = 0;
    this.fishesThisRun = 0;
    this.lives = 5;
    this.items = [];
    this.itemSpawnTimer = 0.5;
    this.zoomiesMeter = 0;
    this.zoomiesActive = false;
    this.particles = [];
    this.floatingTexts = [];
    audio.tone(440, 'triangle', 0.1, 0.2);
  }

  swat() {
    if (this.isSwatting) return;
    this.isSwatting = true;
    this.swatTimer = 0.22;
    audio.swat();

    let hit = false;
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      if (!it.swatted && it.x > 175 && it.x < 285) {
        it.swatted = true;
        it.vx = Math.random() * 160 + 120;
        it.vy = -Math.random() * 180 - 120;
        it.rotSpeed = (Math.random() - 0.5) * 14;
        hit = true;
        this.handleHit(it);
        break;
      }
    }
    if (!hit) {
      this.spawnText(210, this.tableY - 30, 'SWISH!', '#aaa');
    }
  }

  handleHit(item) {
    audio.smash();
    let gain = 100, label = 'SMASH! 💥', col = '#fbc531';
    if (item.type === 'vase') { gain = 300; label = 'EXPENSIVE VASE! 🏺'; col = '#ff4757'; this.fishCount += 2; this.fishesThisRun += 2; }
    else if (item.type === 'coffee') { gain = 180; label = 'HOT COFFEE SPILL! ☕'; col = '#ffa502'; this.fishCount += 1; this.fishesThisRun += 1; }
    else if (item.type === 'phone') { gain = 450; label = 'SMARTPHONE CRACK! 📱'; col = '#00d2d3'; this.fishCount += 3; this.fishesThisRun += 3; }
    else if (item.type === 'duck') { gain = 80; label = 'SQUEAK! 🦆'; col = '#ffd32a'; }
    else if (item.type === 'fishbowl') { gain = 600; label = 'FREED FISH! 🐟'; col = '#2ed573'; this.fishCount += 5; this.fishesThisRun += 5; }
    else if (item.type === 'cactus') {
      gain = 10; label = 'OUCH SPIKY! 🌵'; col = '#ff6b81';
      this.lives--; this.shake = 10;
      if (this.lives <= 0) this.die();
    }

    this.score += gain;
    this.zoomiesMeter = Math.min(100, this.zoomiesMeter + 20);
    if (this.zoomiesMeter >= 100 && !this.zoomiesActive) {
      this.zoomiesActive = true;
      this.zoomiesTimer = 4.5;
      audio.frenzy();
      this.spawnText(180, 220, '⚡ HYPER ZOOMIES! ⚡', '#ffd32a');
    }

    this.spawnText(item.x, item.y - 15, label, col);
    this.updateHUD();
    localStorage.setItem('fc_fishCount', this.fishCount.toString());

    // Particles
    for (let i = 0; i < 10; i++) {
      this.particles.push({
        x: item.x, y: item.y, vx: (Math.random()-0.5)*200, vy: -Math.random()*150-50, size: Math.random()*6+3, color: col, life: 0.7, maxLife: 0.7
      });
    }
  }

  spawnText(x, y, text, color) {
    this.floatingTexts.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
  }

  die() {
    this.state = 'GAMEOVER';
    this.shake = 14;
    if (this.score > this.bestScore) {
      this.bestScore = this.score;
      localStorage.setItem('miele_knock_best', this.bestScore.toString());
      this.spawnText(180, 180, 'NEW BEST!', '#ffd32a');
    }
  }

  update(dt) {
    this.time += dt;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 35);
    if (this.isSwatting) {
      this.swatTimer -= dt;
      if (this.swatTimer <= 0) this.isSwatting = false;
    }
    if (this.zoomiesActive) {
      this.zoomiesTimer -= dt;
      if (this.zoomiesTimer <= 0) { this.zoomiesActive = false; this.zoomiesMeter = 0; }
    }

    if (this.state === 'PLAYING') {
      this.itemSpawnTimer -= dt;
      if (this.itemSpawnTimer <= 0) {
        const types = ['cup', 'vase', 'coffee', 'duck', 'phone', 'fishbowl', 'cactus'];
        const chosen = types[Math.floor(Math.random()*types.length)];
        this.items.push({
          x: 380, y: this.tableY - 24, type: chosen, swatted: false, vx: 0, vy: 0, rot: 0, rotSpeed: 0
        });
        this.itemSpawnTimer = this.zoomiesActive ? 0.35 : (Math.random()*0.8 + 0.85);
      }

      const speed = this.zoomiesActive ? 240 : 120;
      for (let i = this.items.length - 1; i >= 0; i--) {
        const it = this.items[i];
        if (!it.swatted) {
          it.x -= speed * dt;
          if (this.zoomiesActive && it.x < 240) {
            it.swatted = true; it.vx = 220; it.vy = -180; it.rotSpeed = 8;
            this.handleHit(it);
          }
          if (it.x < 75) {
            if (it.type !== 'cactus') {
              this.lives--;
              this.spawnText(it.x, it.y - 10, 'MISSED!', '#aaa');
              if (this.lives <= 0) this.die();
            }
            this.items.splice(i, 1);
          }
        } else {
          it.x += it.vx * dt; it.vy += 480 * dt; it.y += it.vy * dt; it.rot += it.rotSpeed * dt;
          if (it.y > 640) this.items.splice(i, 1);
        }
      }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 280 * dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const t = this.floatingTexts[i]; t.life -= dt; t.y -= 35 * dt;
      if (t.life <= 0) this.floatingTexts.splice(i, 1);
    }
  }

  render() {
    ctx.save();
    if (this.shake > 0) ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);

    // Living Room Wall
    const grad = ctx.createLinearGradient(0,0,0,640);
    grad.addColorStop(0, '#2c3e50'); grad.addColorStop(1, '#34495e');
    ctx.fillStyle = grad; ctx.fillRect(0,0,360,640);

    // Wall Frame & Clock
    ctx.fillStyle = '#f39c12'; ctx.fillRect(50, 70, 75, 55);
    ctx.fillStyle = '#3498db'; ctx.fillRect(54, 74, 67, 47);
    ctx.fillStyle = '#ecf0f1'; ctx.beginPath(); ctx.arc(280, 95, 20, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(279, 82, 2, 14); ctx.fillRect(279, 95, 10, 2);

    // Table
    ctx.fillStyle = '#a0522d'; ctx.fillRect(0, this.tableY, 360, 36);
    ctx.fillStyle = '#6b371e'; ctx.fillRect(0, this.tableY+36, 360, 200);
    ctx.fillStyle = '#cd853f'; ctx.fillRect(0, this.tableY, 360, 4);

    // Items
    this.items.forEach(it => {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      if (it.type === 'cup') {
        ctx.fillStyle = '#fff'; ctx.fillRect(-10, -14, 20, 28);
        ctx.fillStyle = '#3498db'; ctx.fillRect(-8, -10, 16, 8);
      } else if (it.type === 'vase') {
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(-12, -22, 24, 44);
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(-8, -12, 16, 8);
      } else if (it.type === 'coffee') {
        ctx.fillStyle = '#795548'; ctx.fillRect(-10, -12, 20, 24);
        ctx.fillStyle = '#5d4037'; ctx.fillRect(-12, -14, 24, 4);
      } else if (it.type === 'duck') {
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(-12, -10, 24, 20);
        ctx.fillStyle = '#e67e22'; ctx.fillRect(8, -6, 6, 6);
      } else if (it.type === 'phone') {
        ctx.fillStyle = '#111'; ctx.fillRect(-8, -16, 16, 32);
        ctx.fillStyle = '#00d2d3'; ctx.fillRect(-6, -13, 12, 26);
      } else if (it.type === 'fishbowl') {
        ctx.fillStyle = 'rgba(116, 185, 255, 0.75)'; ctx.fillRect(-14, -14, 28, 28);
        ctx.fillStyle = '#ff7675'; ctx.fillRect(-4, -4, 8, 8);
      } else if (it.type === 'cactus') {
        ctx.fillStyle = '#27ae60'; ctx.fillRect(-10, -18, 20, 36);
        ctx.fillStyle = '#d35400'; ctx.fillRect(-12, 10, 24, 10);
      }
      ctx.restore();
    });

    // Cat on Table
    ctx.save(); ctx.translate(this.catX + 34, this.tableY - 14);
    const sprite = this.isSwatting ? (catImages.swat || catImages.f0) : catImages.f0;
    if (sprite && sprite.complete) {
      ctx.drawImage(sprite, -40, -25, 80, 48);
    }
    ctx.restore();

    // Zoomies Meter
    ctx.fillStyle = '#111'; ctx.fillRect(60, 580, 240, 16);
    ctx.fillStyle = this.zoomiesActive ? '#ffd32a' : '#54a0ff';
    ctx.fillRect(62, 582, (this.zoomiesMeter / 100) * 236, 12);
    ctx.font = '7.5px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
    ctx.fillText(this.zoomiesActive ? '⚡ HYPER ZOOMIES! ⚡' : 'ZOOMIES METER', 110, 592);

    // Lives
    ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#ff4757';
    ctx.fillText('LIVES: ' + '❤️'.repeat(Math.max(0, this.lives)), 20, 130);

    // Particles & Text
    this.particles.forEach(p => {
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life / p.maxLife); ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size); ctx.restore();
    });
    this.floatingTexts.forEach(t => {
      ctx.save(); ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillStyle = '#000'; ctx.fillText(t.text, t.x+1, t.y+1);
      ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    });

    // Overlays
    if (this.state === 'PLAYING') {
      ctx.font = '20px "Press Start 2P", monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = '#000'; ctx.fillText(this.score.toString(), 182, 82);
      ctx.fillStyle = '#fff'; ctx.fillText(this.score.toString(), 180, 80);
    } else if (this.state === 'MENU') {
      ctx.textAlign = 'center';
      ctx.font = '16px "Press Start 2P", monospace';
      ctx.fillStyle = '#000'; ctx.fillText('KNOCK IT OFF!', 182, 222);
      ctx.fillStyle = '#fbc531'; ctx.fillText('KNOCK IT OFF!', 180, 220);
      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
      ctx.fillText('TABLETOP CAT CHAOS', 180, 245);
      if (Math.sin(this.time * 6) > 0) {
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillText('TAP OR SPACE TO SWAT', 180, 340);
      }
      ctx.font = '8.5px "Press Start 2P", monospace'; ctx.fillStyle = '#ffd32a';
      ctx.fillText(`BEST SCORE: ${this.bestScore}`, 180, 480);
    } else if (this.state === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,360,640);
      ctx.textAlign = 'center';
      ctx.font = '18px "Press Start 2P", monospace'; ctx.fillStyle = '#ff4757';
      ctx.fillText('GAME OVER', 180, 200);

      ctx.fillStyle = '#0f1420'; ctx.fillRect(40, 220, 280, 180);
      ctx.strokeStyle = '#54a0ff'; ctx.lineWidth = 3; ctx.strokeRect(40, 220, 280, 180);

      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#aaa';
      ctx.fillText('SCORE', 180, 255);
      ctx.font = '16px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
      ctx.fillText(this.score.toString(), 180, 280);

      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#aaa';
      ctx.fillText('BEST SCORE', 180, 310);
      ctx.font = '13px "Press Start 2P", monospace'; ctx.fillStyle = '#ffd32a';
      ctx.fillText(this.bestScore.toString(), 180, 330);

      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#00d2d3';
      ctx.fillText(`+${this.fishesThisRun} 🐟 COLLECTED`, 180, 365);

      if (Math.sin(this.time * 6) > 0) {
        ctx.font = '10px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
        ctx.fillText('TAP TO PLAY AGAIN', 180, 440);
      }
    }
    ctx.restore();
  }
}

const game = new KnockGame();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  game.update(dt); game.render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
