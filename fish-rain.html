  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #080b18; font-family: 'Press Start 2P', monospace; color: #fff; display: flex; justify-content: center; align-items: center; }
    #game-container { position: relative; width: 100%; max-width: 440px; height: 100%; max-height: 840px; aspect-ratio: 9/16; background: #000; box-shadow: 0 12px 36px rgba(0,0,0,0.85); overflow: hidden; display: flex; flex-direction: column; }
    @media (min-width: 480px) and (min-height: 600px) { #game-container { height: 94vh; border: 4px solid #2e384d; border-radius: 16px; } }
    @media (max-width: 480px) or (max-height: 600px) { body { padding: 0; } #game-container { width: 100vw; height: 100vh; max-height: 100vh; max-width: 100vw; border: none; border-radius: 0; } }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; pointer-events: auto; }
    .icon-btn { background: #1e2638; border: 2px solid #54a0ff; color: #fff; font-family: inherit; font-size: 9px; padding: 8px 10px; border-radius: 6px; cursor: pointer; box-shadow: 0 4px #0f1420; outline: none; }
    .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px #0f1420; }
    .badge { background: rgba(15,20,32,0.92); border: 2px solid #fbc531; border-radius: 20px; padding: 6px 12px; font-size: 10px; color: #fbc531; display: flex; align-items: center; gap: 6px; text-shadow: 1px 1px #000; box-shadow: 0 4px #0f1420; }
    .crt-overlay { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%); background-size: 100% 4px; opacity: 0.4; z-index: 5; }
    .modal { position: absolute; inset: 0; background: rgba(12, 16, 26, 0.96); display: none; flex-direction: column; align-items: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px; pointer-events: auto; z-index: 100; overflow-y: auto; }
    .modal.active { display: flex; }
    .modal-title { font-size: 13px; color: #54a0ff; margin-bottom: 12px; text-align: center; }
    .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; margin-bottom: 16px; }
    .shop-item { background: #151b28; border: 2px solid #2d3850; border-radius: 8px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .shop-item.equipped { border-color: #2ed573; background: #142a20; }
    .item-name { font-size: 8px; color: #fff; }
    .item-icon { font-size: 24px; margin: 4px 0; }
    .item-cost { font-size: 8px; color: #fbc531; }
    .item-btn { width: 100%; font-size: 8px; padding: 6px; font-family: inherit; border-radius: 4px; cursor: pointer; border: 2px solid; outline: none; }
    .item-btn.buy { background: #fbc531; border-color: #d6980d; color: #000; box-shadow: 0 3px #8e6804; }
    .item-btn.equip { background: #54a0ff; border-color: #2e86de; color: #fff; box-shadow: 0 3px #185294; }
    .item-btn.equipped { background: #2ed573; border-color: #10ac84; color: #000; cursor: default; }
    .close-btn { margin-top: auto; width: 100%; padding: 12px; font-size: 10px; background: #ff4757; border: 2px solid #c23616; color: #fff; font-family: inherit; border-radius: 6px; cursor: pointer; box-shadow: 0 4px #8b1800; }
  </style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="360" height="640"></canvas>
  <div class="crt-overlay"></div>
  <div class="ui-overlay">
    <div class="top-bar">
      <div class="badge"><span>🐟</span><span id="fish-count">0</span></div>
      <div style="display:flex; gap:6px;">
        <button class="icon-btn" id="btn-shop">🎩 SHOP</button>
        <button class="icon-btn" id="btn-meow">🐱 MEOW</button>
        <button class="icon-btn" id="btn-sound">🔊</button>
      </div>
    </div>
  </div>

  <!-- Shop Modal -->
  <div class="modal" id="shop-modal">
    <div class="modal-title">🐱 MIELE'S WARDROBE 🎩</div>
    <div class="items-grid" id="shop-items-container"></div>
    <button class="close-btn" id="btn-close-shop">BACK TO GAME</button>
  </div>
</div>

    const osc = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime;
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (bend) osc.frequency.exponentialRampToValueAtTime(Math.max(10, bend), t+d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(endV, t+d);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t+d);
  }
  shock() { this.tone(920, 'sawtooth', 0.28, 0.4, 0.01, 1400); }
  catch() { this.tone(587, 'sine', 0.1, 0.25, 0.01, 880); }
  fever() { [523, 659, 783, 1046, 1318].forEach((f, i) => setTimeout(() => this.tone(f, 'sine', 0.15, 0.2, 0.01), i*60)); }
  meow() {
    if (!this.on) return; this.ensure();
    const t = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(450, t); osc.frequency.linearRampToValueAtTime(820, t+0.12); osc.frequency.exponentialRampToValueAtTime(400, t+0.32);
    g.gain.setValueAtTime(0.25, t); g.gain.linearRampToValueAtTime(0.3, t+0.1); g.gain.exponentialRampToValueAtTime(0.01, t+0.32);
    osc.connect(g); g.connect(this.ctx.destination); osc.start(t); osc.stop(t+0.33);
  }
  startBGM() {
    if (!this.on || this.bgmTimer) return; this.ensure();
    const melody = [587, 0, 659, 0, 783, 0, 880, 0, 783, 0, 659, 0, 587, 659, 783, 0];
    this.bgmTimer = setInterval(() => {
      if (!this.on || game.state !== 'PLAYING') return;
      const n = melody[this.step % melody.length];
      if (n > 0) this.tone(n, 'triangle', 0.12, 0.08, 0.01);
      this.step++;
    }, 160);
  }
  stopBGM() { if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; } }
}
const audio = new SoundSys();

const SHOP_HATS = [
  { id: 'none', name: 'No Hat', icon: '🐾', cost: 0 },
  { id: 'chef', name: 'Chef Hat', icon: '👨‍🍳', cost: 5 },
  { id: 'party', name: 'Party Cone', icon: '🥳', cost: 10 },
  { id: 'crown', name: 'Gold Crown', icon: '👑', cost: 20 },
  { id: 'shades', name: 'Cool Shades', icon: '🕶️', cost: 25 },
  { id: 'pirate', name: 'Pirate Hat', icon: '🏴‍☠️', cost: 35 },
  { id: 'halo', name: 'Angel Halo', icon: '😇', cost: 50 }
];

class RainGame {
  constructor() {
    this.state = 'MENU';
    this.score = 0;
    this.bestScore = parseInt(localStorage.getItem('miele_rain_best') || '0', 10);
    this.fishCount = parseInt(localStorage.getItem('fc_fishCount') || '0', 10);
    this.unlockedHats = JSON.parse(localStorage.getItem('fc_unlocked_hats') || '["none"]');
    this.equippedHat = localStorage.getItem('fc_hat') || 'none';
    this.fishesThisRun = 0;
    this.lives = 3;
    this.catX = 180;
    this.targetX = 180;
    this.catY = 530;
    this.catVy = 0;
    this.catFrame = 'f0';
    this.eatTimer = 0;
    this.shockTimer = 0;
    this.items = [];
    this.itemSpawnTimer = 0.35;
    this.particles = [];
    this.floatingTexts = [];
    this.time = 0;
    this.shake = 0;
    this.init();
  }

  init() {
    document.getElementById('btn-sound').addEventListener('click', (e) => {
      e.stopPropagation(); audio.on = !audio.on;
      document.getElementById('btn-sound').textContent = audio.on ? '🔊' : '🔇';
      if (!audio.on) audio.stopBGM(); else audio.startBGM();
    });
    document.getElementById('btn-meow').addEventListener('click', (e) => {
      e.stopPropagation(); audio.meow();
      this.eatTimer = 0.5;
      this.spawnText(this.catX, this.catY - 45, 'MEOW! 🐟', '#ff78cb');
    });
    document.getElementById('btn-shop').addEventListener('click', (e) => {
      e.stopPropagation(); this.openShop();
    });
    document.getElementById('btn-close-shop').addEventListener('click', (e) => {
      e.stopPropagation(); this.closeShop();
    });

    const getX = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      return (clientX - rect.left) * scaleX;
    };

    canvas.addEventListener('pointerdown', (e) => {
      audio.ensure();
      if (this.state === 'MENU' || this.state === 'GAMEOVER') {
        this.startRun();
      } else if (this.state === 'PLAYING') {
        this.targetX = Math.max(40, Math.min(320, getX(e)));
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (this.state === 'PLAYING') {
        this.targetX = Math.max(40, Math.min(320, getX(e)));
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.targetX = Math.max(40, this.catX - 60);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') this.targetX = Math.min(320, this.catX + 60);
      if (e.code === 'Space' && (this.state === 'MENU' || this.state === 'GAMEOVER')) this.startRun();
    });

    this.updateHUD();
  }

  updateHUD() {
    document.getElementById('fish-count').textContent = this.fishCount;
  }

  startRun() {
    this.state = 'PLAYING';
    this.score = 0;
    this.fishesThisRun = 0;
    this.lives = 3;
    this.catX = 180;
    this.targetX = 180;
    this.catY = 530;
    this.catVy = 0;
    this.items = [];
    this.itemSpawnTimer = 0.35;
    this.shockTimer = 0;
    this.eatTimer = 0;
    this.particles = [];
    this.floatingTexts = [];
    audio.tone(523, 'triangle', 0.12, 0.2);
    audio.startBGM();
  }

  spawnText(x, y, text, color) {
    this.floatingTexts.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
  }

  die() {
    this.state = 'GAMEOVER';
    this.shake = 16;
    audio.stopBGM();
    if (this.score > this.bestScore) {
      this.bestScore = this.score;
      localStorage.setItem('miele_rain_best', this.bestScore.toString());
      this.spawnText(180, 180, 'NEW BEST!', '#ffd32a');
    }
  }

  update(dt) {
    this.time += dt;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 35);
    if (this.shockTimer > 0) this.shockTimer -= dt;
    if (this.eatTimer > 0) this.eatTimer -= dt;

    if (this.state === 'PLAYING') {
      this.catX += (this.targetX - this.catX) * 14 * dt;

      // Vertical jump if shocked by cucumber!
      if (this.shockTimer > 0) {
        this.catVy += 800 * dt;
        this.catY += this.catVy * dt;
        if (this.catY >= 530) { this.catY = 530; this.catVy = 0; }
        this.catFrame = 'shock';
      } else if (this.eatTimer > 0) {
        this.catFrame = 'f3';
        this.catY = 530;
      } else {
        const moving = Math.abs(this.targetX - this.catX) > 4;
        this.catFrame = moving ? (Math.sin(this.time * 12) > 0 ? 'f1' : 'f2') : 'f0';
        this.catY = 530;
      }

      // Spawn falling pixel items
      this.itemSpawnTimer -= dt;
      if (this.itemSpawnTimer <= 0) {
        const r = Math.random();
        let type = 'sushi';
        if (r < 0.20) type = 'cucumber';
        else if (r < 0.32) type = 'spray';
        else if (r < 0.55) type = 'sushi';
        else if (r < 0.75) type = 'chicken';
        else if (r < 0.90) type = 'tuna_can';
        else type = 'star';

        this.items.push({
          x: Math.random() * 280 + 40, y: -40, w: 46, h: 46, type: type, vy: Math.random() * 40 + 135, rot: (Math.random()-0.5)*0.5
        });
        this.itemSpawnTimer = Math.random() * 0.35 + 0.35;
      }

      const catBox = { cx: this.catX, cy: this.catY - 10, r: 28 };
      for (let i = this.items.length - 1; i >= 0; i--) {
        const it = this.items[i];
        it.y += it.vy * dt;

        const dist = Math.hypot(catBox.cx - (it.x + it.w/2), catBox.cy - (it.y + it.h/2));
        if (dist < catBox.r + 20) {
          if (it.type === 'cucumber') {
            this.shockTimer = 1.0; this.catVy = -320; this.lives--; this.shake = 14;
            audio.shock();
            this.spawnText(this.catX, this.catY - 60, '🥒 CUCUMBER!! 😱', '#ff4757');
            if (this.lives <= 0) this.die();
          } else if (it.type === 'spray') {
            this.shockTimer = 0.6; this.catVy = -180; this.lives--;
            audio.tone(180, 'sawtooth', 0.2, 0.3);
            this.spawnText(this.catX, this.catY - 60, '💦 SQUIRT! 🙀', '#00d2d3');
            if (this.lives <= 0) this.die();
          } else {
            let pts = 50, gainFish = 1, label = '+1 🐟';
            if (it.type === 'sushi') { pts = 100; gainFish = 2; label = '+2 🍣 SUSHI!'; }
            else if (it.type === 'chicken') { pts = 200; gainFish = 3; label = '+3 🍗 CHICKEN!'; }
            else if (it.type === 'tuna_can') { pts = 350; gainFish = 4; label = '+4 🥫 TUNA CAN!'; }
            else if (it.type === 'star') { pts = 500; gainFish = 5; label = '⭐ RAINBOW FEVER!'; audio.fever(); }

            this.score += pts;
            this.fishCount += gainFish;
            this.fishesThisRun += gainFish;
            this.eatTimer = 0.4;
            audio.catch();
            this.spawnText(it.x, it.y - 10, label, '#fbc531');
            this.updateHUD();
            localStorage.setItem('fc_fishCount', this.fishCount.toString());

            // Happy hearts
            for (let h = 0; h < 5; h++) {
              this.particles.push({
                x: this.catX + (Math.random()*20-10), y: this.catY - 20, vx: (Math.random()-0.5)*80, vy: -Math.random()*80-30, size: 8, color: '#ff4757', life: 0.6, maxLife: 0.6, type: 'heart'
              });
            }
          }
          this.items.splice(i, 1);
        } else if (it.y > 640) {
          this.items.splice(i, 1);
        }
      }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const t = this.floatingTexts[i]; t.life -= dt; t.y -= 35 * dt;
      if (t.life <= 0) this.floatingTexts.splice(i, 1);
    }
  }

  render() {
    ctx.save();
    if (this.shake > 0) ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);

    // Starry Night Room
    const grad = ctx.createLinearGradient(0,0,0,640);
    grad.addColorStop(0, '#0c1024'); grad.addColorStop(1, '#1e2749');
    ctx.fillStyle = grad; ctx.fillRect(0,0,360,640);

    // Stars
    for (let i = 0; i < 26; i++) {
      ctx.fillStyle = Math.sin(this.time * 4 + i) > 0 ? '#fff' : '#687898';
      ctx.fillRect((i * 47) % 340 + 10, (i * 31) % 400 + 40, 2, 2);
    }

    // Crescent Moon
    ctx.fillStyle = '#f5cd79'; ctx.beginPath(); ctx.arc(300, 80, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0c1024'; ctx.beginPath(); ctx.arc(293, 76, 18, 0, Math.PI*2); ctx.fill();

    // Carpet Floor
    ctx.fillStyle = '#c0392b'; ctx.fillRect(0, 550, 360, 90);
    ctx.fillStyle = '#962d22'; for (let x = 0; x < 360; x += 18) ctx.fillRect(x, 550, 9, 90);
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(0, 550, 360, 4);

    // Falling Pixel Art Items
    this.items.forEach(it => {
      ctx.save(); ctx.translate(it.x + it.w/2, it.y + it.h/2); ctx.rotate(it.rot);
      const img = images[it.type];
      if (img && img.complete) {
        ctx.drawImage(img, -it.w/2, -it.h/2, it.w, it.h);
      }
      ctx.restore();
    });

    // Miele Cat
    ctx.save(); ctx.translate(this.catX, this.catY - 10);
    const sprite = images[this.catFrame] || images.f0;
    if (sprite && sprite.complete) {
      ctx.drawImage(sprite, -44, -28, 88, 52);
    }
    this.drawHat(-8, -26);
    ctx.restore();

    // Hearts Lives
    ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#ff4757';
    ctx.fillText('LIVES: ' + '❤️'.repeat(Math.max(0, this.lives)), 20, 145);

    // Particles & Text
    this.particles.forEach(p => {
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      if (p.type === 'heart') {
        ctx.font = '12px monospace'; ctx.fillText('❤️', p.x, p.y);
      } else {
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.restore();
    });

    this.floatingTexts.forEach(t => {
      ctx.save(); ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillStyle = '#000'; ctx.fillText(t.text, t.x+1, t.y+1);
      ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    });

    // UI
    if (this.state === 'PLAYING') {
      ctx.font = '20px "Press Start 2P", monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = '#000'; ctx.fillText(this.score.toString(), 182, 82);
      ctx.fillStyle = '#fff'; ctx.fillText(this.score.toString(), 180, 80);
    } else if (this.state === 'MENU') {
      ctx.textAlign = 'center';
      ctx.font = '16px "Press Start 2P", monospace';
      ctx.fillStyle = '#000'; ctx.fillText('FISH RAIN', 182, 222);
      ctx.fillStyle = '#ffd32a'; ctx.fillText('FISH RAIN', 180, 220);
      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
      ctx.fillText('CATCH THE TREATS!', 180, 245);
      if (Math.sin(this.time * 6) > 0) {
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillText('TAP OR SLIDE TO PLAY', 180, 340);
      }
      ctx.font = '8.5px "Press Start 2P", monospace'; ctx.fillStyle = '#ffd32a';
      ctx.fillText(`BEST SCORE: ${this.bestScore}`, 180, 480);
    } else if (this.state === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,360,640);
      ctx.textAlign = 'center';
      ctx.font = '18px "Press Start 2P", monospace'; ctx.fillStyle = '#ff4757';
      ctx.fillText('GAME OVER', 180, 200);

      ctx.fillStyle = '#0f1420'; ctx.fillRect(40, 220, 280, 180);
      ctx.strokeStyle = '#54a0ff'; ctx.lineWidth = 3; ctx.strokeRect(40, 220, 280, 180);

      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#aaa';
      ctx.fillText('SCORE', 180, 255);
      ctx.font = '16px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
      ctx.fillText(this.score.toString(), 180, 280);

      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#aaa';
      ctx.fillText('BEST SCORE', 180, 310);
      ctx.font = '13px "Press Start 2P", monospace'; ctx.fillStyle = '#ffd32a';
      ctx.fillText(this.bestScore.toString(), 180, 330);

      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#00d2d3';
      ctx.fillText(`+${this.fishesThisRun} 🐟 COLLECTED`, 180, 365);

      if (Math.sin(this.time * 6) > 0) {
        ctx.font = '10px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
        ctx.fillText('TAP TO PLAY AGAIN', 180, 440);
      }
    }
    ctx.restore();
  }

  drawHat(hx, hy) {
    if (this.equippedHat === 'none') return;
    if (this.equippedHat === 'chef') {
      ctx.fillStyle = '#fff'; ctx.fillRect(hx, hy, 16, 12);
    } else if (this.equippedHat === 'crown') {
      ctx.fillStyle = '#fbc531'; ctx.fillRect(hx, hy + 2, 16, 8);
      ctx.fillStyle = '#e84118'; ctx.fillRect(hx + 2, hy + 4, 3, 3);
    } else if (this.equippedHat === 'party') {
      ctx.fillStyle = '#e84118'; ctx.beginPath();
      ctx.moveTo(hx + 8, hy - 6); ctx.lineTo(hx, hy + 10); ctx.lineTo(hx + 16, hy + 10); ctx.fill();
    } else if (this.equippedHat === 'shades') {
      ctx.fillStyle = '#111'; ctx.fillRect(hx + 8, hy + 14, 18, 6);
    } else if (this.equippedHat === 'pirate') {
      ctx.fillStyle = '#2f3640'; ctx.fillRect(hx - 2, hy + 3, 20, 7);
    } else if (this.equippedHat === 'halo') {
      ctx.strokeStyle = '#fbc531'; ctx.lineWidth = 2; ctx.strokeRect(hx - 2, hy - 8, 20, 5);
    }
  }

  openShop() {
    document.getElementById('shop-modal').classList.add('active');
    this.renderShop();
  }
  closeShop() {
    document.getElementById('shop-modal').classList.remove('active');
  }
  renderShop() {
    const c = document.getElementById('shop-items-container');
    c.innerHTML = '';
    SHOP_HATS.forEach(h => {
      const unlocked = this.unlockedHats.includes(h.id) || h.cost === 0;
      const equipped = this.equippedHat === h.id;
      const card = document.createElement('div');
      card.className = 'shop-item' + (equipped ? ' equipped' : '');
      card.innerHTML = `
        <div class="item-name">${h.name}</div>
        <div class="item-icon">${h.icon}</div>
        <div class="item-cost">${h.cost > 0 ? h.cost + ' 🐟' : 'FREE'}</div>
        <button class="item-btn ${equipped ? 'equipped' : (unlocked ? 'equip' : 'buy')}">
          ${equipped ? 'EQUIPPED' : (unlocked ? 'EQUIP' : 'BUY')}
        </button>
      `;
      card.querySelector('.item-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (equipped) return;
        if (unlocked) {
          this.equippedHat = h.id;
          localStorage.setItem('fc_hat', this.equippedHat);
          this.renderShop();
        } else if (this.fishCount >= h.cost) {
          this.fishCount -= h.cost;
          this.unlockedHats.push(h.id);
          this.equippedHat = h.id;
          localStorage.setItem('fc_fishCount', this.fishCount.toString());
          localStorage.setItem('fc_unlocked_hats', JSON.stringify(this.unlockedHats));
          localStorage.setItem('fc_hat', this.equippedHat);
          this.updateHUD();
          this.renderShop();
        } else {
          alert(`Need ${h.cost - this.fishCount} more fishes! 🐟`);
        }
      });
      c.appendChild(card);
    });
  }
}

const game = new RainGame();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  game.update(dt); game.render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
