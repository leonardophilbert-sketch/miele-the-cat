  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      touch-action: none; -webkit-touch-callout: none;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #080c14; font-family: 'Press Start 2P', monospace;
      color: #fff; display: flex; justify-content: center; align-items: center;
    }
    #game-container {
      position: relative; width: 100%; max-width: 440px; height: 100%; max-height: 840px;
      aspect-ratio: 9/16; background: #5c94fc;
      box-shadow: 0 16px 45px rgba(0,0,0,0.9); overflow: hidden;
      display: flex; flex-direction: column;
    }
    @media (min-width: 480px) and (min-height: 600px) {
      #game-container { height: 94vh; border: 4px solid #2e384d; border-radius: 16px; }
    }
    @media (max-width: 480px) or (max-height: 600px) {
      body { padding: 0; }
      #game-container { width: 100vw; height: 100vh; max-height: 100vh; max-width: 100vw; border: none; border-radius: 0; }
    }
    canvas {
      width: 100%; height: 100%; display: block;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    .ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
      z-index: 10;
      padding-top: max(10px, env(safe-area-inset-top, 10px));
      padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 14px; pointer-events: auto;
      text-shadow: 2px 2px #000;
    }
    .hud-text { font-size: 8px; line-height: 1.4; color: #fff; }
    .hud-val { color: #fbc531; }
    .icon-btn {
      background: #1e2638; border: 2px solid #54a0ff; color: #fff;
      font-family: inherit; font-size: 8px; padding: 6px 8px;
      border-radius: 6px; cursor: pointer; box-shadow: 0 3px #0f1420; outline: none;
    }
    .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px #0f1420; }
    .crt-overlay {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.08) 50%);
      background-size: 100% 4px; opacity: 0.25; z-index: 5;
    }
    
    /* Robust Multi-Touch Controls (Optimized for iPhone thumb reach) */
    .touch-controls {
      position: absolute; bottom: max(10px, env(safe-area-inset-bottom, 10px)); left: 0;
      width: 100%; padding: 0 14px; display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none; z-index: 20;
    }
    .dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 4px; pointer-events: auto; }
    .dpad-btn {
      background: rgba(16, 22, 34, 0.88); border: 2px solid #54a0ff; color: #fff;
      font-family: inherit; font-size: 16px; border-radius: 10px;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px #080c14; outline: none;
    }
    .dpad-btn.active, .dpad-btn:active { background: #54a0ff; color: #000; transform: translateY(2px); }
    .action-btns { display: flex; gap: 12px; pointer-events: auto; }
    .action-btn {
      width: 58px; height: 58px; border-radius: 50%;
      background: #e84118; border: 3px solid #ff6b81; color: #fff;
      font-family: inherit; font-size: 10px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 5px #8c1d07; outline: none;
    }
    .action-btn.btn-b { background: #2ed573; border-color: #7bed9f; box-shadow: 0 5px #15733d; }
    .action-btn.active, .action-btn:active { transform: translateY(3px); box-shadow: 0 1px #000; }

    /* Wardrobe Modal */
    .modal {
      position: absolute; inset: 0; background: rgba(10, 14, 24, 0.96);
      display: none; flex-direction: column; align-items: center;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 16px;
      pointer-events: auto; z-index: 100; overflow-y: auto;
    }
    .modal.active { display: flex; }
    .modal-title { font-size: 12px; color: #fbc531; margin-bottom: 12px; text-align: center; text-shadow: 2px 2px #000; }
    .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; margin-bottom: 16px; }
    .shop-item { background: #151b28; border: 2px solid #2d3850; border-radius: 8px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .shop-item.equipped { border-color: #2ed573; background: #142a20; }
    .item-name { font-size: 8px; color: #fff; }
    .item-icon { font-size: 24px; margin: 4px 0; }
    .item-cost { font-size: 8px; color: #fbc531; }
    .item-btn { width: 100%; font-size: 8px; padding: 6px; font-family: inherit; border-radius: 4px; cursor: pointer; border: 2px solid; outline: none; }
    .item-btn.buy { background: #fbc531; border-color: #d6980d; color: #000; }
    .item-btn.equip { background: #54a0ff; border-color: #2e86de; color: #fff; }
    .item-btn.equipped { background: #2ed573; border-color: #10ac84; color: #000; cursor: default; }
    .close-btn { margin-top: auto; width: 100%; padding: 12px; font-size: 9px; background: #ff4757; border: 2px solid #c23616; color: #fff; font-family: inherit; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="360" height="640"></canvas>
  <div class="crt-overlay"></div>
  <div class="ui-overlay">
    <div class="top-bar">
      <div class="hud-text">
        MIELE<br><span class="hud-val" id="score-val">000000</span>
      </div>
      <div class="hud-text">
        🪙x<span class="hud-val" id="coin-val">00</span>
      </div>
      <div class="hud-text">
        WORLD<br><span class="hud-val">1-1</span>
      </div>
      <div class="hud-text">
        TIME<br><span class="hud-val" id="time-val">400</span>
      </div>
      <div style="display:flex; gap:5px;">
        <button class="icon-btn" id="btn-caps">🎩 HATS</button>
        <button class="icon-btn" id="btn-sound">🔊</button>
      </div>
    </div>

    <!-- Mobile Touch Dpad & Buttons -->
    <div class="touch-controls">
      <div class="dpad">
        <button class="dpad-btn" id="btn-left" style="grid-column:1; grid-row:2;">◀</button>
        <button class="dpad-btn" id="btn-down" style="grid-column:2; grid-row:2;">▼</button>
        <button class="dpad-btn" id="btn-right" style="grid-column:3; grid-row:2;">▶</button>
      </div>
      <div class="action-btns">
        <button class="action-btn btn-b" id="btn-run">B<br><span style="font-size:7px;">RUN</span></button>
        <button class="action-btn" id="btn-jump">A<br><span style="font-size:7px;">JUMP</span></button>
      </div>
    </div>
  </div>

  <!-- Hats Modal -->
  <div class="modal" id="caps-modal">
    <div class="modal-title">🐱 MIELE'S MARIO HATS 🧢</div>
    <div class="items-grid" id="caps-container"></div>
    <button class="close-btn" id="btn-close-caps">BACK TO WORLD 1-1</button>
  </div>
</div>

// Audio Synthesizer (Authentic Classic Mario 1-1 BGM & SFX)
class SoundSys {
  constructor() { this.ctx = null; this.on = true; this.bgmTimer = null; this.step = 0; }
  ensure() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  tone(f, type, d, v=0.25, endV=0.001, bend=null) {
    if (!this.on) return; this.ensure();
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime;
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (bend) osc.frequency.exponentialRampToValueAtTime(Math.max(10, bend), t+d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(endV, t+d);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t+d);
  }
  jump() { this.tone(260, 'square', 0.16, 0.3, 0.01, 600); }
  coin() {
    this.tone(987, 'sine', 0.08, 0.25, 0.01);
    setTimeout(() => this.tone(1318, 'sine', 0.24, 0.3, 0.01), 60);
  }
  stomp() { this.tone(280, 'square', 0.12, 0.35, 0.01, 80); }
  bump() { this.tone(120, 'square', 0.1, 0.3, 0.01, 40); }
  flagpole() {
    const n = [523, 659, 783, 1046, 1318, 1567];
    n.forEach((f, i) => setTimeout(() => this.tone(f, 'square', 0.18, 0.3, 0.01), i*70));
  }
  startBGM() {
    if (!this.on || this.bgmTimer) return; this.ensure();
    const m = [
      659, 659, 0, 659, 0, 523, 659, 0, 784, 0, 0, 0, 392, 0, 0, 0,
      523, 0, 0, 392, 0, 0, 330, 0, 440, 0, 494, 0, 466, 440, 0, 392,
      659, 784, 880, 0, 698, 784, 0, 659, 0, 523, 587, 494, 0, 0,
      523, 0, 0, 392, 0, 0, 330, 0, 440, 0, 494, 0, 466, 440, 0, 392
    ];
    this.bgmTimer = setInterval(() => {
      if (!this.on || game.state !== 'PLAYING') return;
      const n = m[this.step % m.length];
      if (n > 0) this.tone(n, 'square', 0.09, 0.08, 0.01);
      this.step++;
    }, 130);
  }
  stopBGM() { if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; } }
}

        e.preventDefault(); e.stopPropagation();
        audio.ensure();
        this.keys[key] = true;
        b.classList.add('active');
        if (key === 'jump' && (this.state === 'MENU' || this.state === 'GAMEOVER')) this.startRun();
      };
      const onEnd = (e) => {
        e.preventDefault(); e.stopPropagation();
        this.keys[key] = false;
        b.classList.remove('active');
      };
      b.addEventListener('touchstart', onStart, { passive: false });
      b.addEventListener('touchend', onEnd, { passive: false });
      b.addEventListener('touchcancel', onEnd, { passive: false });
      b.addEventListener('pointerdown', onStart);
      b.addEventListener('pointerup', onEnd);
      b.addEventListener('pointercancel', onEnd);
    };

    setupTouchBtn('btn-left', 'left');
    setupTouchBtn('btn-right', 'right');
    setupTouchBtn('btn-down', 'down');
    setupTouchBtn('btn-jump', 'jump');
    setupTouchBtn('btn-run', 'run');

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') this.keys.down = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        this.keys.jump = true;
        if (this.state === 'MENU' || this.state === 'GAMEOVER') this.startRun();
      }
      if (e.code === 'ShiftLeft' || e.code === 'KeyZ' || e.code === 'KeyX') this.keys.run = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') this.keys.down = false;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') this.keys.jump = false;
      if (e.code === 'ShiftLeft' || e.code === 'KeyZ' || e.code === 'KeyX') this.keys.run = false;
    });

    document.getElementById('btn-sound').addEventListener('click', (e) => {
      e.stopPropagation(); audio.on = !audio.on;
      document.getElementById('btn-sound').textContent = audio.on ? '🔊' : '🔇';
      if (!audio.on) audio.stopBGM(); else audio.startBGM();
    });
    document.getElementById('btn-caps').addEventListener('click', (e) => {
      e.stopPropagation(); this.openCaps();
    });
    document.getElementById('btn-close-caps').addEventListener('click', (e) => {
      e.stopPropagation(); this.closeCaps();
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#caps-modal') || e.target.closest('.top-bar') || e.target.closest('.touch-controls')) return;
      audio.ensure();
      if (this.state === 'MENU' || this.state === 'GAMEOVER') this.startRun();
    });
  }

  updateHUD() {
    document.getElementById('score-val').textContent = this.score.toString().padStart(6, '0');
    document.getElementById('coin-val').textContent = this.coins.toString().padStart(2, '0');
    document.getElementById('time-val').textContent = Math.ceil(this.timeRemaining).toString();
  }

  startRun() {
    this.state = 'PLAYING';
    this.x = 60; this.y = 400; this.vx = 0; this.vy = 0;
    this.score = 0; this.coins = 0; this.timeRemaining = 400;
    this.goalReached = false; this.victoryTally = false;
    this.initLevel();
    this.updateHUD();
    audio.tone(523, 'square', 0.15, 0.2);
    audio.startBGM();
  }

  spawnText(x, y, text, color) {
    this.floatingTexts.push({ x, y, text, color, life: 0.8, maxLife: 0.8 });
  }

  update(dt) {
    this.time += dt;

    if (this.state !== 'PLAYING') return;

    if (this.goalReached) {
      if (this.flagpole.flagY < this.groundY - 45) {
        this.flagpole.flagY += 180 * dt;
        this.y += 180 * dt;
      } else {
        this.vx = 80;
        this.x += this.vx * dt;
        this.walkTimer += dt;
        if (this.x >= this.castle.x + 60) {
          this.victoryTally = true;
          audio.stopBGM();
        }
      }
      return;
    }

    this.timeRemaining -= dt * 2.5;
    if (this.timeRemaining <= 0) {
      this.die(); return;
    }

    // Physics
    const maxSpeed = this.keys.run ? 240 : 160;
    const accel = 620;
    const friction = 520;
    const gravity = 880;

    if (this.keys.left) {
      this.vx -= accel * dt; this.facing = -1;
      this.walkTimer += dt;
    } else if (this.keys.right) {
      this.vx += accel * dt; this.facing = 1;
      this.walkTimer += dt;
    } else {
      if (this.vx > 0) this.vx = Math.max(0, this.vx - friction * dt);
      else if (this.vx < 0) this.vx = Math.min(0, this.vx + friction * dt);
    }
    this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));

    if (this.keys.jump && this.onGround) {
      this.vy = -450;
      this.onGround = false;
      audio.jump();
      this.particles.push({ x: this.x + 18, y: this.y + 36, vx: -this.facing * 30, vy: -10, size: 4, color: '#e0d8c0', life: 0.3, maxLife: 0.3 });
    }

    this.vy += gravity * dt;

    // Horizontal Movement & Collisions
    this.x += this.vx * dt;
    this.x = Math.max(0, this.x);

    this.pipes.forEach(p => {
      if (this.checkAABB(this.x, this.y, this.w, this.h, p.x, p.y + 4, p.w, p.h - 4)) {
        if (this.vx > 0) this.x = p.x - this.w;
        else if (this.vx < 0) this.x = p.x + p.w;
        this.vx = 0;
      }
    });

    this.blocks.forEach(b => {
      if (this.checkAABB(this.x, this.y + 4, this.w, this.h - 8, b.x, b.y, b.w, b.h)) {
        if (this.vx > 0) this.x = b.x - this.w;
        else if (this.vx < 0) this.x = b.x + b.w;
        this.vx = 0;
      }
    });

    // Vertical Movement & Collisions
    this.y += this.vy * dt;
    this.onGround = false;

    this.platforms.forEach(p => {
      if (this.x + this.w - 4 > p.x && this.x + 4 < p.x + p.w) {
        if (this.y + this.h >= p.y && this.y + this.h <= p.y + 24 && this.vy >= 0) {
          this.y = p.y - this.h;
          this.vy = 0;
          this.onGround = true;
        }
      }
    });

    this.pipes.forEach(p => {
      if (this.x + this.w - 4 > p.x && this.x + 4 < p.x + p.w) {
        if (this.y + this.h >= p.y && this.y + this.h <= p.y + 20 && this.vy >= 0) {
          this.y = p.y - this.h;
          this.vy = 0;
          this.onGround = true;
        }
      }
    });

    this.blocks.forEach(b => {
      if (b.bumpY < 0) b.bumpY += 80 * dt;
      if (this.x + this.w - 4 > b.x && this.x + 4 < b.x + b.w) {
        if (this.y + this.h >= b.y && this.y + this.h <= b.y + 18 && this.vy >= 0) {
          this.y = b.y - this.h;
          this.vy = 0;
          this.onGround = true;
        }
        else if (this.y <= b.y + b.h && this.y >= b.y + b.h - 18 && this.vy < 0) {
          this.y = b.y + b.h;
          this.vy = 20;
          if (!b.hit) {
            b.hit = true; b.bumpY = -8;
            if (b.type === 'qblock') {
              audio.coin();
              this.coins++; this.score += 200;
              this.floatingCoins.push({ x: b.x + 8, y: b.y - 10, vy: -240, life: 0.5 });
              this.spawnText(b.x, b.y - 24, '+200 🪙', '#fbc531');
            } else {
              audio.bump();
              this.score += 50;
            }
            this.updateHUD();
          }
        }
      }
    });

    // Enemy AI & Collisions (Squish timer bug fixed!)
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (!e.dead) {
        e.x += e.vx * dt;
        e.waddle += dt * 8;
        this.pipes.forEach(p => {
          if (this.checkAABB(e.x, e.y, e.w, e.h, p.x, p.y, p.w, p.h)) e.vx = -e.vx;
        });

        if (this.checkAABB(this.x + 4, this.y + 4, this.w - 8, this.h - 4, e.x + 4, e.y + 4, e.w - 8, e.h - 4)) {
          if (this.vy > 0 && this.y + this.h <= e.y + 20) {
            e.dead = true; e.squishTimer = 0.45;
            this.vy = -320;
            audio.stomp();
            this.score += 100;
            this.spawnText(e.x, e.y - 15, '100', '#fff');
            this.updateHUD();
          } else {
            this.die();
          }
        }
      } else {
        e.squishTimer -= dt;
        if (e.squishTimer <= 0) {
          this.enemies.splice(i, 1);
        }
      }
    }

    // Flagpole Goal Trigger
    if (this.flagpole && !this.flagpole.cleared) {
      if (this.x + this.w >= this.flagpole.x) {
        this.flagpole.cleared = true;
        this.goalReached = true;
        this.x = this.flagpole.x - 14;
        this.vx = 0; this.vy = 0;
        audio.stopBGM();
        audio.flagpole();
        this.score += 5000;
        this.spawnText(this.x, this.y - 30, '5000 COURSE CLEAR!', '#fbc531');
        this.updateHUD();
      }
    }

    // Pit death
    if (this.y > 640) this.die();

    // Camera follow
    const targetCamX = this.x - 120;
    this.camX += (targetCamX - this.camX) * 12 * dt;
    this.camX = Math.max(0, Math.min(this.levelWidth - 360, this.camX));

    // Floating Coins & Particle Updates
    for (let i = this.floatingCoins.length - 1; i >= 0; i--) {
      const fc = this.floatingCoins[i]; fc.life -= dt; fc.y += fc.vy * dt; fc.vy += 600 * dt;
      if (fc.life <= 0) this.floatingCoins.splice(i, 1);
    }
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const t = this.floatingTexts[i]; t.life -= dt; t.y -= 30 * dt;
      if (t.life <= 0) this.floatingTexts.splice(i, 1);
    }
  }

  checkAABB(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }

  die() {
    this.state = 'GAMEOVER';
    audio.stopBGM();
    audio.tone(150, 'sawtooth', 0.4, 0.4, 0.01, 30);
  }

  render() {
    // 1. Classic Blue Sky
    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(0, 0, 360, 640);

    ctx.save();
    ctx.translate(-this.camX, 0);

    // 2. Clouds
    this.clouds.forEach(c => {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(c.x + 20, c.y + 16, 16, 0, Math.PI*2);
      ctx.arc(c.x + 40, c.y + 10, 20, 0, Math.PI*2);
      ctx.arc(c.x + 60, c.y + 16, 16, 0, Math.PI*2);
      ctx.fill();
    });

    // 3. Hills with cute eyes
    this.hills.forEach(h => {
      ctx.fillStyle = '#00a800';
      ctx.beginPath();
      ctx.arc(h.x + h.w/2, h.y + h.h, h.w/2, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.fillRect(h.x + h.w/2 - 8, h.y + 18, 4, 10);
      ctx.fillRect(h.x + h.w/2 + 4, h.y + 18, 4, 10);
      ctx.fillStyle = '#fff';
      ctx.fillRect(h.x + h.w/2 - 8, h.y + 18, 2, 3);
      ctx.fillRect(h.x + h.w/2 + 4, h.y + 18, 2, 3);
    });

    // 4. Bushes
    this.bushes.forEach(b => {
      ctx.fillStyle = '#00a800';
      ctx.beginPath();
      ctx.arc(b.x + 20, b.y + 16, 16, 0, Math.PI*2);
      ctx.arc(b.x + b.w/2, b.y + 10, 22, 0, Math.PI*2);
      ctx.arc(b.x + b.w - 20, b.y + 16, 16, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    });

    // 5. Ground Bricks (Aligned to 36x36 grid)
    this.platforms.forEach(p => {
      for (let x = p.x; x < p.x + p.w; x += B_SIZE) {
        for (let y = p.y; y < p.y + p.h; y += B_SIZE) {
          this.drawGroundBrick(x, y);
        }
      }
    });

    // 6. Warp Pipes
    this.pipes.forEach(p => {
      const pipeImg = images.pipe;
      if (pipeImg && pipeImg.complete) {
        ctx.drawImage(pipeImg, p.x, p.y, p.w, p.h);
      }
    });

    // 7. Full-Size Exact Square Blocks ([?] & Bricks)
    this.blocks.forEach(b => {
      let bImg = images.brick;
      if (b.type === 'qblock') {
        bImg = b.hit ? images.hit_block : images.qblock;
      } else if (b.type === 'stair') {
        bImg = images.hit_block;
      }
      if (bImg && bImg.complete) {
        ctx.drawImage(bImg, b.x, b.y + b.bumpY, B_SIZE, B_SIZE);
      }
    });

    // 8. Flagpole & Castle
    if (this.flagpole) {
      ctx.fillStyle = '#000'; ctx.fillRect(this.flagpole.x, this.flagpole.y, 6, this.flagpole.h);
      ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(this.flagpole.x + 3, this.flagpole.y, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#00a800';
      ctx.beginPath();
      ctx.moveTo(this.flagpole.x, this.flagpole.flagY);
      ctx.lineTo(this.flagpole.x - 30, this.flagpole.flagY + 14);
      ctx.lineTo(this.flagpole.x, this.flagpole.flagY + 28);
      ctx.fill();
    }

    if (this.castle) {
      ctx.fillStyle = '#d35400'; ctx.fillRect(this.castle.x, this.castle.y, this.castle.w, this.castle.h);
      for (let bx = this.castle.x; bx < this.castle.x + this.castle.w; bx += 32) {
        ctx.fillRect(bx, this.castle.y - 18, 20, 18);
      }
      ctx.fillStyle = '#000';
      ctx.fillRect(this.castle.x + this.castle.w/2 - 20, this.castle.y + this.castle.h - 54, 40, 54);
    }

    // 9. Goombas & Bob-ombs
    this.enemies.forEach(e => {
      if (!e.dead) {
        const eImg = e.type === 'bobomb' ? images.bobomb : images.goomba;
        if (eImg && eImg.complete) {
          ctx.save();
          ctx.translate(e.x + e.w/2, e.y + e.h/2);
          const tilt = Math.sin(e.waddle) * 0.1;
          ctx.rotate(tilt);
          ctx.drawImage(eImg, -e.w/2, -e.h/2, e.w, e.h);
          ctx.restore();
        }
      } else if (e.squishTimer > 0) {
        ctx.fillStyle = '#8e44ad';
        ctx.fillRect(e.x, e.y + 24, e.w, 12);
      }
    });

    // 10. Floating Coins
    this.floatingCoins.forEach(fc => {
      const cImg = images.coin;
      if (cImg && cImg.complete) {
        ctx.drawImage(cImg, fc.x, fc.y, 24, 24);
      }
    });

    // 11. Miele The Cat Hero
    ctx.save();
    ctx.translate(this.x + this.w/2, this.y + this.h/2);
    if (this.facing === -1) ctx.scale(-1, 1);

    let catImg = images.f0;
    if (this.goalReached) catImg = images.f3;
    else if (!this.onGround) catImg = images.f1;
    else if (Math.abs(this.vx) > 10) {
      const step = Math.floor(this.walkTimer * 11) % 3;
      catImg = step === 0 ? images.f0 : (step === 1 ? images.f1 : images.f2);
    }

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 16, 18, 5, 0, 0, Math.PI*2);
    ctx.fill();

    if (catImg && catImg.complete) {
      ctx.drawImage(catImg, -30, -18, 60, 36);
    }
    this.drawHat(-6, -20);
    ctx.restore();

    // Floating Texts
    this.floatingTexts.forEach(t => {
      ctx.save(); ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillStyle = '#000'; ctx.fillText(t.text, t.x+1, t.y+1);
      ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    });

    ctx.restore(); // end camera

    // Screen Overlays
    if (this.state === 'MENU') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0,0,360,640);
      ctx.textAlign = 'center';
      ctx.font = '16px "Press Start 2P", monospace';
      ctx.fillStyle = '#000'; ctx.fillText('SUPER MIELE', 182, 222);
      ctx.fillStyle = '#fbc531'; ctx.fillText('SUPER MIELE', 180, 220);

      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
      ctx.fillText('WORLD 1-1', 180, 250);

      if (Math.sin(this.time * 6) > 0) {
        ctx.font = '10px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
        ctx.fillText('PRESS JUMP / SPACE', 180, 340);
      }
    } else if (this.victoryTally) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,360,640);
      ctx.textAlign = 'center';
      ctx.font = '16px "Press Start 2P", monospace'; ctx.fillStyle = '#ffd32a';
      ctx.fillText('COURSE CLEAR! 🌟', 180, 210);

      ctx.fillStyle = '#101726'; ctx.fillRect(36, 230, 288, 170);
      ctx.strokeStyle = '#54a0ff'; ctx.lineWidth = 3; ctx.strokeRect(36, 230, 288, 170);

      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#aaa';
      ctx.fillText('FINAL SCORE', 180, 265);
      ctx.font = '15px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
      ctx.fillText(this.score.toString(), 180, 290);

      ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#fbc531';
      ctx.fillText(`🪙 ${this.coins} COINS COLLECTED`, 180, 325);
      ctx.fillText(`⏱️ ${Math.ceil(this.timeRemaining)}s TIME LEFT`, 180, 350);

      if (Math.sin(this.time * 6) > 0) {
        ctx.font = '10px "Press Start 2P", monospace'; ctx.fillStyle = '#2ed573';
        ctx.fillText('TAP TO PLAY AGAIN', 180, 440);
      }
    } else if (this.state === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,360,640);
      ctx.textAlign = 'center';
      ctx.font = '18px "Press Start 2P", monospace'; ctx.fillStyle = '#ff4757';
      ctx.fillText('GAME OVER', 180, 260);
      if (Math.sin(this.time * 6) > 0) {
        ctx.font = '10px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
        ctx.fillText('TAP TO RETRY', 180, 340);
      }
    }
  }

  drawGroundBrick(x, y) {
    ctx.fillStyle = '#d35400'; ctx.fillRect(x, y, B_SIZE, B_SIZE);
    ctx.fillStyle = '#e67e22'; ctx.fillRect(x, y, B_SIZE-2, 16); ctx.fillRect(x, y+18, B_SIZE-2, 16);
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y+16, B_SIZE, 2); ctx.fillRect(x+16, y, 2, 16); ctx.fillRect(x+34, y+18, 2, 16);
  }

  drawHat(hx, hy) {
    if (this.equippedHat === 'none') return;
    if (this.equippedHat === 'mario_cap') {
      ctx.fillStyle = '#e84118'; ctx.fillRect(hx - 2, hy + 4, 18, 8);
      ctx.fillStyle = '#fff'; ctx.fillRect(hx + 4, hy + 6, 4, 4);
    } else if (this.equippedHat === 'wing_cap') {
      ctx.fillStyle = '#e84118'; ctx.fillRect(hx - 2, hy + 4, 18, 8);
      ctx.fillStyle = '#fff'; ctx.fillRect(hx - 8, hy, 8, 6); ctx.fillRect(hx + 16, hy, 8, 6);
    } else if (this.equippedHat === 'crown') {
      ctx.fillStyle = '#fbc531'; ctx.fillRect(hx, hy + 2, 16, 8);
      ctx.fillStyle = '#e84118'; ctx.fillRect(hx + 2, hy + 4, 3, 3);
    } else if (this.equippedHat === 'chef') {
      ctx.fillStyle = '#fff'; ctx.fillRect(hx, hy - 4, 16, 14);
    } else if (this.equippedHat === 'shades') {
      ctx.fillStyle = '#111'; ctx.fillRect(hx + 8, hy + 12, 16, 6);
    } else if (this.equippedHat === 'pirate') {
      ctx.fillStyle = '#2f3640'; ctx.fillRect(hx - 2, hy + 2, 20, 7);
    } else if (this.equippedHat === 'halo') {
      ctx.strokeStyle = '#fbc531'; ctx.lineWidth = 2; ctx.strokeRect(hx - 2, hy - 8, 20, 5);
    }
  }

  openCaps() {
    document.getElementById('caps-modal').classList.add('active');
    this.renderCaps();
  }
  closeCaps() {
    document.getElementById('caps-modal').classList.remove('active');
  }
  renderCaps() {
    const c = document.getElementById('caps-container');
    c.innerHTML = '';
    SHOP_HATS.forEach(h => {
      const unlocked = this.unlockedHats.includes(h.id) || h.cost === 0;
      const equipped = this.equippedHat === h.id;
      const card = document.createElement('div');
      card.className = 'shop-item' + (equipped ? ' equipped' : '');
      card.innerHTML = `
        <div class="item-name">${h.name}</div>
        <div class="item-icon">${h.icon}</div>
        <div class="item-cost">${h.cost > 0 ? h.cost + ' 🪙' : 'FREE'}</div>
        <button class="item-btn ${equipped ? 'equipped' : (unlocked ? 'equip' : 'buy')}">
          ${equipped ? 'EQUIPPED' : (unlocked ? 'EQUIP' : 'BUY')}
        </button>
      `;
      card.querySelector('.item-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (equipped) return;
        if (unlocked) {
          this.equippedHat = h.id;
          localStorage.setItem('miele_hat', this.equippedHat);
          this.renderCaps();
        } else if (this.coins >= h.cost) {
          this.coins -= h.cost;
          this.unlockedHats.push(h.id);
          this.equippedHat = h.id;
          localStorage.setItem('fc_unlocked_hats', JSON.stringify(this.unlockedHats));
          localStorage.setItem('miele_hat', this.equippedHat);
          this.updateHUD();
          this.renderCaps();
        } else {
          alert(`Need ${h.cost - this.coins} more coins! 🪙`);
        }
      });
      c.appendChild(card);
    });
  }
}

const game = new SuperMieleGame();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  game.update(dt); game.render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
