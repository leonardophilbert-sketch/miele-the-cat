  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #0d111a;
      background-image: 
        radial-gradient(#1c2436 1.5px, transparent 1.5px),
        radial-gradient(#1c2436 1.5px, #0d111a 1.5px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      font-family: 'Press Start 2P', monospace, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 840px;
      aspect-ratio: 9 / 16;
      background: #000;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85), 0 0 24px rgba(64, 159, 244, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 480px) and (min-height: 600px) {
      #game-container {
        height: 94vh;
        border: 4px solid #2e384d;
        border-radius: 16px;
      }
    }
    @media (max-width: 480px) or (max-height: 600px) {
      body {
        padding: 0;
        background: #000;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        max-width: 100vw;
        border: none;
        border-radius: 0;
      }
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #409ff4;
    }
    /* Controls Bar & Floating UI */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      pointer-events: auto;
    }
    .icon-btn {
      background: #1e2638;
      border: 2px solid #54a0ff;
      color: #fff;
      font-family: inherit;
      font-size: 9px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px #0f1420;
      transition: transform 0.05s, box-shadow 0.05s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:hover {
      background: #2b364e;
    }
    .icon-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px #0f1420;
    }
    .fish-counter-badge {
      background: rgba(15, 20, 32, 0.9);
      border: 2px solid #fbc531;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 10px;
      color: #fbc531;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 1px 1px #000;
      box-shadow: 0 4px #0f1420;
    }
    /* CRT Scanlines Overlay */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 4px, 6px 100%;
      opacity: 0.4;
      z-index: 5;
    }
    /* Modal / Wardrobe */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(12, 16, 26, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)) 16px;
      pointer-events: auto;
      z-index: 100;
      overflow-y: auto;
    }
    .modal.active {
      display: flex;
    }
    .modal-title {
      font-size: 13px;
      color: #54a0ff;
      margin-bottom: 12px;
      text-align: center;
      text-shadow: 2px 2px #000;
    }
    .shop-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      width: 100%;
    }
    .shop-tab {
      flex: 1;
      font-size: 9px;
      padding: 8px;
      background: #1c2436;
      border: 2px solid #3a4768;
      color: #aaa;
      cursor: pointer;
      border-radius: 6px;
      text-align: center;
    }
    .shop-tab.active {
      background: #2e3d5c;
      border-color: #54a0ff;
      color: #fff;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
    }
    .shop-item {
      background: #151b28;
      border: 2px solid #2d3850;
      border-radius: 8px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }
    .shop-item.equipped {
      border-color: #2ed573;
      background: #142a20;
    }
    .item-name {
      font-size: 8px;
      color: #fff;
      line-height: 1.3;
    }
    .item-icon {
      font-size: 24px;
      margin: 4px 0;
    }
    .item-cost {
      font-size: 8px;
      color: #fbc531;
    }
    .item-btn {
      width: 100%;
      font-size: 8px;
      padding: 6px;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid;
      outline: none;
    }
    .item-btn.buy {
      background: #fbc531;
      border-color: #d6980d;
      color: #000;
      box-shadow: 0 3px #8e6804;
    }
    .item-btn.buy:active {
      transform: translateY(2px);
      box-shadow: 0 1px #8e6804;
    }
    .item-btn.equip {
      background: #54a0ff;
      border-color: #2e86de;
      color: #fff;
      box-shadow: 0 3px #185294;
    }
    .item-btn.equip:active {
      transform: translateY(2px);
      box-shadow: 0 1px #185294;
    }
    .item-btn.equipped {
      background: #2ed573;
      border-color: #10ac84;
      color: #000;
      cursor: default;
    }
    .close-btn {
      margin-top: auto;
      width: 100%;
      padding: 12px;
      font-size: 10px;
      background: #ff4757;
      border: 2px solid #c23616;
      color: #fff;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px #8b1800;
      outline: none;
    }
    .close-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px #8b1800;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="360" height="640"></canvas>
  <div class="crt-overlay"></div>

  <div class="ui-overlay">
    <div class="top-bar">
      <div class="fish-counter-badge">
        <span>🐟</span>
        <span id="hud-fish-count">0</span>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="icon-btn" id="btn-shop" title="Wardrobe">🎩 SHOP</button>
        <button class="icon-btn" id="btn-meow" title="Meow!">🐱 MEOW</button>
        <button class="icon-btn" id="btn-sound" title="Toggle Sound">🔊</button>
      </div>
    </div>
  </div>

// Audio Synthesizer (100% Web Audio API - Zero External Dependencies)
class RetroAudio {
  constructor() {
    this.ctx = null;
    this.soundEnabled = true;
    this.musicEnabled = true;
    this.bgmTimer = null;
    this.bgmStep = 0;
    this.initStorage();
  }

  initStorage() {
    const s = localStorage.getItem('fc_sound');
    if (s !== null) this.soundEnabled = (s === '1');
    const m = localStorage.getItem('fc_music');
    if (m !== null) this.musicEnabled = (m === '1');
    this.updateSoundBtn();
  }

  ensureContext() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleSound() {
    this.soundEnabled = !this.soundEnabled;
    this.musicEnabled = this.soundEnabled;
    localStorage.setItem('fc_sound', this.soundEnabled ? '1' : '0');
    localStorage.setItem('fc_music', this.musicEnabled ? '1' : '0');
    this.updateSoundBtn();
    if (!this.soundEnabled) {
      this.stopBGM();
    } else {
      this.ensureContext();
      this.playJump();
    }
  }

  updateSoundBtn() {
    const btn = document.getElementById('btn-sound');
    if (btn) btn.textContent = this.soundEnabled ? '🔊' : '🔇';
  }

  playTone(freq, type, duration, startVol = 0.25, endVol = 0.001, bendFreq = null) {
    if (!this.soundEnabled) return;
    this.ensureContext();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const t = this.ctx.currentTime;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (bendFreq !== null) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(10, bendFreq), t + duration);
    }
    gain.gain.setValueAtTime(startVol, t);
    gain.gain.exponentialRampToValueAtTime(endVol, t + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }

  playJump() {
    this.playTone(320, 'triangle', 0.12, 0.25, 0.01, 680);
  }

  playMeow() {
    if (!this.soundEnabled) return;
    this.ensureContext();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(450, t);
    osc.frequency.linearRampToValueAtTime(820, t + 0.12);
    osc.frequency.exponentialRampToValueAtTime(400, t + 0.32);
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.linearRampToValueAtTime(0.3, t + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.32);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.33);
  }

  playFish(type = 'common') {
    if (!this.soundEnabled) return;
    this.ensureContext();
    const freqs = type === 'rainbow' 
      ? [523.25, 659.25, 783.99, 1046.50, 1318.51] 
      : type === 'golden' 
      ? [587.33, 739.99, 880.00, 1174.66] 
      : [523.25, 659.25, 783.99];
    const dur = 0.06;
    freqs.forEach((f, i) => {
      setTimeout(() => {
        this.playTone(f, 'sine', 0.15, 0.2, 0.01);
      }, i * (dur * 1000));
    });
  }

  playScore() {
    this.playTone(987.77, 'square', 0.08, 0.15, 0.01, 1318.51);
  }

  playHit() {
    if (!this.soundEnabled) return;
    this.ensureContext();
    this.playTone(180, 'sawtooth', 0.22, 0.35, 0.01, 40);
  }

  playGameOver() {
    if (!this.soundEnabled) return;
    const notes = [440, 392, 349, 293];
    notes.forEach((n, idx) => {
      setTimeout(() => {
        this.playTone(n, 'triangle', 0.25, 0.25, 0.01);
      }, idx * 160);
    });
  }

  startBGM() {
    if (!this.musicEnabled || this.bgmTimer) return;
    this.ensureContext();
    const bpm = 138;
    const stepTime = (60 / bpm) / 2; // 8th note
    const melody = [
      659.25, 0, 659.25, 0, 0, 659.25, 0, 523.25, 
      659.25, 0, 783.99, 0, 0, 0, 392.00, 0,
      523.25, 0, 0, 392.00, 0, 0, 329.63, 0,
      0, 440.00, 0, 493.88, 0, 466.16, 440.00, 0
    ];
    const bass = [
      261.63, 261.63, 329.63, 329.63, 392.00, 392.00, 329.63, 329.63,
      220.00, 220.00, 261.63, 261.63, 329.63, 329.63, 261.63, 261.63
    ];
    this.bgmTimer = setInterval(() => {
      if (!this.musicEnabled || game.state !== 'PLAYING') return;
      const mNote = melody[this.bgmStep % melody.length];
      if (mNote > 0) {
        this.playTone(mNote, 'square', 0.09, 0.08, 0.005);
      }
      if (this.bgmStep % 2 === 0) {
        const bNote = bass[(this.bgmStep / 2) % bass.length];
        this.playTone(bNote / 2, 'triangle', 0.18, 0.12, 0.01);
      }
      this.bgmStep++;
    }, stepTime * 1000);
  }

  stopBGM() {
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
    }
  }
}

    localStorage.setItem('fc_fishCount', this.fishCount.toString());
    localStorage.setItem('fc_unlocked', JSON.stringify(this.unlockedItems));
    localStorage.setItem('fc_hat', this.equippedHat);
    localStorage.setItem('fc_trail', this.equippedTrail);
  }

  updateHUD() {
    const el = document.getElementById('hud-fish-count');
    if (el) el.textContent = this.fishCount;
  }

  initControls() {
    const doJump = (e) => {
      if (e) {
        if (e.target.closest('#shop-modal') || e.target.closest('.top-bar')) return;
        e.preventDefault();
      }
      audio.ensureContext();
      
      if (this.state === 'MENU') {
        this.startRun();
      } else if (this.state === 'PLAYING') {
        this.flap();
      } else if (this.state === 'GAMEOVER') {
        this.startRun();
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        doJump(e);
      } else if (e.code === 'KeyM') {
        this.triggerMeow();
      } else if (e.code === 'KeyP') {
        this.togglePause();
      }
    });

    // Touch & Pointer listeners optimized for iOS
    canvas.addEventListener('pointerdown', doJump, { passive: false });
    window.addEventListener('touchstart', () => audio.ensureContext(), { passive: true, once: true });

    document.getElementById('btn-sound').addEventListener('click', (e) => {
      e.stopPropagation();
      audio.toggleSound();
    });

    document.getElementById('btn-meow').addEventListener('click', (e) => {
      e.stopPropagation();
      this.triggerMeow();
    });

    document.getElementById('btn-shop').addEventListener('click', (e) => {
      e.stopPropagation();
      this.openShop();
    });

    document.getElementById('btn-close-shop').addEventListener('click', (e) => {
      e.stopPropagation();
      this.closeShop();
    });

    document.getElementById('tab-hats').addEventListener('click', () => {
      this.activeShopTab = 'hats';
      this.renderShopItems();
    });

    document.getElementById('tab-trails').addEventListener('click', () => {
      this.activeShopTab = 'trails';
      this.renderShopItems();
    });
  }

  triggerMeow() {
    audio.ensureContext();
    audio.playMeow();
    this.cat.meowBubbleTimer = 1.0;
    this.cat.frame = 'f3';
    this.cat.eatTimer = 0.4;
    this.spawnText(this.cat.x + 40, this.cat.y - 10, 'MEOW! ❤️', '#ff78cb');
    // Spawn heart particles
    for (let i = 0; i < 5; i++) {
      this.particles.push({
        x: this.cat.x + 30 + (Math.random() * 20 - 10),
        y: this.cat.y + (Math.random() * 20 - 10),
        vx: Math.random() * 40 - 20,
        vy: -Math.random() * 50 - 30,
        size: Math.random() * 6 + 4,
        color: '#ff4757',
        type: 'heart',
        life: 1.0,
        maxLife: 1.0
      });
    }
  }

  togglePause() {
    if (this.state === 'PLAYING') {
      this.state = 'PAUSED';
      audio.stopBGM();
    } else if (this.state === 'PAUSED') {
      this.state = 'PLAYING';
      audio.startBGM();
    }
  }

  startRun() {
    this.state = 'PLAYING';
    this.score = 0;
    this.fishesThisRun = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.cat.x = 75;
    this.cat.y = 260;
    this.cat.vy = this.jumpForce * 0.8;
    this.cat.rot = -0.2;
    this.cat.frame = 'f1';
    this.cat.animTimer = 0.2;
    this.cat.eatTimer = 0;
    this.cat.meowBubbleTimer = 0;
    this.pipes = [];
    this.fishes = [];
    this.particles = [];
    this.floatingTexts = [];
    this.trailHistory = [];
    this.pipeSpawnTimer = 0.8;
    this.rainbowFeverTimer = 0;
    this.medalAwarded = null;
    audio.playJump();
    audio.startBGM();
  }

  flap() {
    this.cat.vy = this.jumpForce;
    this.cat.frame = 'f1';
    this.cat.animTimer = 0.22;
    this.spawnJumpPuff();
    audio.playJump();
  }

  spawnJumpPuff() {
    for (let i = 0; i < 4; i++) {
      this.particles.push({
        x: this.cat.x + 8,
        y: this.cat.y + 24,
        vx: -Math.random() * 40 - 20,
        vy: Math.random() * 30 - 15,
        size: Math.random() * 5 + 3,
        color: '#ffffff',
        type: 'puff',
        life: 0.35,
        maxLife: 0.35
      });
    }
  }

  spawnPipe() {
    const gap = Math.max(130, 155 - this.score * 0.6);
    const minY = 60;
    const maxY = this.height - this.groundHeight - gap - 60;
    const topHeight = Math.floor(Math.random() * (maxY - minY)) + minY;
    const pipeX = this.width + 10;
    
    this.pipes.push({
      x: pipeX,
      w: 56,
      topY: topHeight,
      bottomY: topHeight + gap,
      passed: false
    });

    // Spawn 1 or 2 fishes in gap
    const numFishes = Math.random() < 0.3 ? 2 : 1;
    for (let i = 0; i < numFishes; i++) {
      const fishOffset = (i === 0 && numFishes === 2) ? -24 : (i === 1 ? 24 : 0);
      const fishY = topHeight + gap / 2 + fishOffset + (Math.random() * 20 - 10);
      const rand = Math.random();
      let type = 'common';
      if (rand < 0.05) type = 'rainbow';
      else if (rand < 0.18) type = 'golden';
      else if (rand < 0.35) type = 'fast';

      this.fishes.push({
        x: pipeX + 28 + (i * 28),
        y: fishY,
        w: 22,
        h: 16,
        type: type,
        phase: Math.random() * Math.PI * 2,
        collected: false
      });
    }
  }

  collectFish(fish) {
    fish.collected = true;
    let fishGain = 1;
    let pointGain = 50;
    let label = '+1 🐟';
    let color = '#fbc531';

    if (fish.type === 'fast') {
      fishGain = 2;
      pointGain = 100;
      label = '+2 ⚡🐟';
      color = '#00d2d3';
    } else if (fish.type === 'golden') {
      fishGain = 3;
      pointGain = 250;
      label = '+3 ⭐🐟';
      color = '#ffd32a';
    } else if (fish.type === 'rainbow') {
      fishGain = 5;
      pointGain = 500;
      label = 'FEVER! 🌈🐟';
      color = '#ff3838';
      this.rainbowFeverTimer = 4.0;
    }

    this.combo++;
    this.comboTimer = 3.0;
    if (this.combo > 1) {
      pointGain += (this.combo - 1) * 25;
      this.spawnText(this.cat.x + 30, this.cat.y - 30, `COMBO x${this.combo}!`, '#ff9ff3');
    }

    this.fishCount += fishGain;
    this.fishesThisRun += fishGain;
    this.score += pointGain;
    this.cat.frame = 'f3';
    this.cat.eatTimer = 0.35;
    this.updateHUD();
    this.saveData();

    audio.playFish(fish.type);
    this.spawnText(fish.x, fish.y - 10, label, color);

    // Sparkles
    for (let i = 0; i < 10; i++) {
      this.particles.push({
        x: fish.x,
        y: fish.y,
        vx: (Math.random() - 0.5) * 120,
        vy: (Math.random() - 0.5) * 120,
        size: Math.random() * 5 + 3,
        color: color,
        type: 'sparkle',
        life: 0.5,
        maxLife: 0.5
      });
    }
  }

  spawnText(x, y, text, color = '#fff') {
    this.floatingTexts.push({
      x: x,
      y: y,
      text: text,
      color: color,
      life: 0.9,
      maxLife: 0.9
    });
  }

  die() {
    this.state = 'GAMEOVER';
    this.shake = 14;
    audio.stopBGM();
    audio.playHit();
    setTimeout(() => audio.playGameOver(), 200);

    if (this.score > this.bestScore) {
      this.bestScore = this.score;
      this.spawnText(this.width / 2, 200, 'NEW BEST!', '#ffd32a');
      this.spawnConfetti();
    }
    
    // Determine Medal
    if (this.score >= 100) this.medalAwarded = '💎 PLATINUM';
    else if (this.score >= 50) this.medalAwarded = '🥇 GOLD';
    else if (this.score >= 25) this.medalAwarded = '🥈 SILVER';
    else if (this.score >= 10) this.medalAwarded = '🥉 BRONZE';
    else this.medalAwarded = null;

    this.saveData();
  }

  spawnConfetti() {
    const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6b81', '#9b59b6'];
    for (let i = 0; i < 40; i++) {
      this.particles.push({
        x: this.width / 2 + (Math.random() * 80 - 40),
        y: 180 + (Math.random() * 40 - 20),
        vx: (Math.random() - 0.5) * 200,
        vy: -Math.random() * 150 - 50,
        size: Math.random() * 6 + 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        type: 'confetti',
        life: 2.0,
        maxLife: 2.0
      });
    }
  }

  update(dt) {
    this.time += dt;

    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 40);
    }

    if (this.rainbowFeverTimer > 0) {
      this.rainbowFeverTimer -= dt;
    }

    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }

    // Scroll parallax background layers
    const speedMult = (this.state === 'PLAYING' ? 1 : 0.3);
    this.cloudOffset = (this.cloudOffset + 18 * dt * speedMult) % this.width;
    this.mountainOffset = (this.mountainOffset + 28 * dt * speedMult) % this.width;
    this.bushOffset = (this.bushOffset + 50 * dt * speedMult) % this.width;
    this.groundOffset = (this.groundOffset + this.gameSpeed * dt * speedMult) % 24;

    if (this.state === 'MENU') {
      this.cat.y = 270 + Math.sin(this.time * 4) * 10;
      this.cat.rot = Math.sin(this.time * 4) * 0.08;
      this.cat.frame = 'f0';
      this.updateTrail(dt);
      this.updateParticles(dt);
      return;
    }

    if (this.state === 'PAUSED') return;

    if (this.state === 'PLAYING') {
      // Apply Gravity
      this.cat.vy += this.gravity * dt;
      this.cat.y += this.cat.vy * dt;

      // Cat rotation based on velocity
      const targetRot = Math.min(Math.PI / 2.5, Math.max(-Math.PI / 8, (this.cat.vy / 500)));
      this.cat.rot += (targetRot - this.cat.rot) * 12 * dt;

      // Update Sprite Animation Frame
      if (this.cat.eatTimer > 0) {
        this.cat.eatTimer -= dt;
        this.cat.frame = 'f3';
      } else if (this.cat.animTimer > 0) {
        this.cat.animTimer -= dt;
        this.cat.frame = 'f1';
      } else if (this.cat.vy > 180) {
        this.cat.frame = 'f2';
      } else {
        this.cat.frame = 'f0';
      }

      // Check Ground & Ceiling Collision
      const floorY = this.height - this.groundHeight - this.cat.h + 8;
      if (this.cat.y >= floorY) {
        this.cat.y = floorY;
        this.die();
      }
      if (this.cat.y <= -20) {
        this.cat.y = -20;
        this.cat.vy = 0;
      }

      // Spawn Pipes
      this.pipeSpawnTimer -= dt;
      if (this.pipeSpawnTimer <= 0) {
        this.spawnPipe();
        this.pipeSpawnTimer = 1.6;
      }

      // Move Pipes & Check Collision
      const catBox = {
        cx: this.cat.x + 34,
        cy: this.cat.y + 19,
        r: 14 // forgiving capsule radius
      };

      for (let i = this.pipes.length - 1; i >= 0; i--) {
        const p = this.pipes[i];
        p.x -= this.gameSpeed * dt;

        // Pipe score passing
        if (!p.passed && p.x + p.w < this.cat.x) {
          p.passed = true;
          this.score += 1;
          audio.playScore();
          this.spawnText(this.cat.x + 20, this.cat.y - 15, '+1', '#2ed573');
        }

        // Collision with Top Pipe
        if (catBox.cx + catBox.r > p.x && catBox.cx - catBox.r < p.x + p.w) {
          if (catBox.cy - catBox.r < p.topY || catBox.cy + catBox.r > p.bottomY) {
            this.die();
            break;
          }
        }

        // Remove off-screen pipes
        if (p.x < -70) {
          this.pipes.splice(i, 1);
        }
      }

      // Move Fishes & Collect Check
      for (let i = this.fishes.length - 1; i >= 0; i--) {
        const f = this.fishes[i];
        f.x -= this.gameSpeed * dt;
        f.y += Math.sin(this.time * 5 + f.phase) * 18 * dt;

        if (!f.collected) {
          const dx = catBox.cx - (f.x + f.w / 2);
          const dy = catBox.cy - (f.y + f.h / 2);
          const dist = Math.hypot(dx, dy);
          if (dist < catBox.r + 14) {
            this.collectFish(f);
          }
        }

        if (f.x < -40 || f.collected) {
          this.fishes.splice(i, 1);
        }
      }

      this.updateTrail(dt);
    } else if (this.state === 'GAMEOVER') {
      // Fall to ground if in air
      if (this.cat.y < this.height - this.groundHeight - this.cat.h + 8) {
        this.cat.vy += this.gravity * dt;
        this.cat.y += this.cat.vy * dt;
        this.cat.rot = Math.PI / 2;
      }
    }

    this.updateParticles(dt);
  }

  updateTrail(dt) {
    if (this.equippedTrail === 'none') return;
    this.trailHistory.unshift({
      x: this.cat.x + 12,
      y: this.cat.y + 19,
      vy: this.cat.vy,
      time: this.time
    });
    if (this.trailHistory.length > 22) {
      this.trailHistory.pop();
    }

    // Spawn custom trail particles
    if (this.equippedTrail === 'sparkles' || this.rainbowFeverTimer > 0) {
      if (Math.random() < 0.45) {
        this.particles.push({
          x: this.cat.x + 5,
          y: this.cat.y + 16 + (Math.random() * 14 - 7),
          vx: -Math.random() * 60 - 20,
          vy: Math.random() * 30 - 15,
          size: Math.random() * 4 + 2,
          color: this.rainbowFeverTimer > 0 ? `hsl(${(this.time * 300) % 360}, 100%, 65%)` : '#ffd32a',
          type: 'sparkle',
          life: 0.4,
          maxLife: 0.4
        });
      }
    } else if (this.equippedTrail === 'bubbles') {
      if (Math.random() < 0.3) {
        this.particles.push({
          x: this.cat.x + 4,
          y: this.cat.y + 19 + (Math.random() * 10 - 5),
          vx: -Math.random() * 30 - 10,
          vy: -Math.random() * 40 - 20,
          size: Math.random() * 5 + 3,
          color: 'rgba(116, 185, 255, 0.7)',
          type: 'bubble',
          life: 0.6,
          maxLife: 0.6
        });
      }
    } else if (this.equippedTrail === 'fire') {
      for (let i = 0; i < 2; i++) {
        this.particles.push({
          x: this.cat.x + 8,
          y: this.cat.y + 19 + (Math.random() * 8 - 4),
          vx: -Math.random() * 70 - 30,
          vy: Math.random() * 20 - 10,
          size: Math.random() * 5 + 2,
          color: Math.random() < 0.5 ? '#ff4757' : '#ffa502',
          type: 'fire',
          life: 0.35,
          maxLife: 0.35
        });
      }
    }
  }

  updateParticles(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.type === 'confetti') p.vy += 200 * dt;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }

    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const t = this.floatingTexts[i];
      t.life -= dt;
      t.y -= 35 * dt;
      if (t.life <= 0) {
        this.floatingTexts.splice(i, 1);
      }
    }
  }

  // Draw Methods
  render() {
    ctx.save();

    // Screen Shake on Hit
    if (this.shake > 0) {
      const dx = (Math.random() - 0.5) * this.shake;
      const dy = (Math.random() - 0.5) * this.shake;
      ctx.translate(dx, dy);
    }

    this.drawSky();
    this.drawClouds();
    this.drawMountains();
    this.drawBushes();
    this.drawPipes();
    this.drawFishes();
    this.drawTrail();
    this.drawCat();
    this.drawGround();
    this.drawParticles();
    this.drawFloatingTexts();
    this.drawUI();

    ctx.restore();
  }

  drawSky() {
    let topColor = '#3b9afe';
    let bottomColor = '#88c9fb';
    if (this.rainbowFeverTimer > 0) {
      topColor = `hsl(${(this.time * 120) % 360}, 75%, 60%)`;
      bottomColor = `hsl(${((this.time * 120) + 40) % 360}, 75%, 80%)`;
    }
    const grad = ctx.createLinearGradient(0, 0, 0, this.height - this.groundHeight);
    grad.addColorStop(0, topColor);
    grad.addColorStop(1, bottomColor);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.width, this.height);

    // Pixel Sun
    ctx.fillStyle = '#fffa65';
    ctx.fillRect(this.width - 64, 40, 28, 28);
    ctx.fillStyle = '#fff200';
    ctx.fillRect(this.width - 60, 44, 20, 20);
  }

  drawClouds() {
    const clouds = [
      { x: 30, y: 70, w: 90, h: 42 },
      { x: 190, y: 120, w: 120, h: 50 },
      { x: 340, y: 55, w: 80, h: 36 }
    ];

    clouds.forEach(c => {
      let renderX = (c.x - this.cloudOffset) % (this.width + 140) - 70;
      if (renderX < -140) renderX += this.width + 140;

      // Dark Blue Outline
      ctx.fillStyle = '#2366b9';
      ctx.fillRect(renderX + 6, c.y, c.w - 12, c.h);
      ctx.fillRect(renderX, c.y + 8, c.w, c.h - 16);
      ctx.fillRect(renderX + 16, c.y - 8, c.w - 32, c.h + 16);

      // Light Blue Cloud Shadow
      ctx.fillStyle = '#9cd0fe';
      ctx.fillRect(renderX + 8, c.y + 4, c.w - 16, c.h - 8);
      ctx.fillRect(renderX + 4, c.y + 10, c.w - 8, c.h - 18);
      ctx.fillRect(renderX + 18, c.y - 4, c.w - 36, c.h + 8);

      // White Cloud Body
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(renderX + 10, c.y + 4, c.w - 24, c.h - 14);
      ctx.fillRect(renderX + 22, c.y - 4, c.w - 44, c.h - 4);
    });
  }

  drawMountains() {
    const baseY = this.height - this.groundHeight - 48;
    ctx.fillStyle = '#2d548f';
    for (let x = -40; x < this.width + 80; x += 70) {
      const mx = (x - this.mountainOffset * 0.4) % (this.width + 140) - 40;
      ctx.beginPath();
      ctx.moveTo(mx, baseY + 48);
      ctx.lineTo(mx + 35, baseY);
      ctx.lineTo(mx + 70, baseY + 48);
      ctx.fill();
    }
  }

  drawBushes() {
    const baseY = this.height - this.groundHeight;
    const bushes = [
      { x: 20, w: 75, h: 36 },
      { x: 130, w: 95, h: 44 },
      { x: 270, w: 80, h: 38 }
    ];

    bushes.forEach(b => {
      let renderX = (b.x - this.bushOffset) % (this.width + 120) - 40;
      if (renderX < -120) renderX += this.width + 120;

      // Dark Green Outline
      ctx.fillStyle = '#1e5f1b';
      ctx.fillRect(renderX, baseY - b.h, b.w, b.h);
      ctx.fillRect(renderX + 6, baseY - b.h - 6, b.w - 12, b.h + 6);

      // Main Bush Green
      ctx.fillStyle = '#52b733';
      ctx.fillRect(renderX + 3, baseY - b.h + 3, b.w - 6, b.h - 3);
      ctx.fillRect(renderX + 8, baseY - b.h - 3, b.w - 16, b.h + 3);

      // Highlight Green
      ctx.fillStyle = '#8de040';
      ctx.fillRect(renderX + 8, baseY - b.h - 1, b.w - 20, 8);
      ctx.fillRect(renderX + 12, baseY - b.h + 6, b.w - 28, 6);
    });
  }

  drawPipes() {
    this.pipes.forEach(p => {
      const pw = p.w;
      const rimH = 22;
      const rimOverlap = 5;

      // --- Top Pipe ---
      const topPipeH = p.topY - rimH;
      this.drawPipeBody(p.x, 0, pw, topPipeH);
      this.drawPipeRim(p.x - rimOverlap, topPipeH, pw + rimOverlap * 2, rimH, true);

      // --- Bottom Pipe ---
      const botY = p.bottomY;
      const botH = this.height - this.groundHeight - botY;
      this.drawPipeRim(p.x - rimOverlap, botY, pw + rimOverlap * 2, rimH, false);
      this.drawPipeBody(p.x, botY + rimH, pw, botH - rimH);
    });
  }

  drawPipeBody(x, y, w, h) {
    if (h <= 0) return;
    ctx.fillStyle = '#0f3d0a';
    ctx.fillRect(x, y, w, h);

    // Green Body Strips
    ctx.fillStyle = '#8de040';
    ctx.fillRect(x + 3, y, 6, h);

    ctx.fillStyle = '#4cb72e';
    ctx.fillRect(x + 9, y, w - 24, h);

    ctx.fillStyle = '#2d841b';
    ctx.fillRect(x + w - 15, y, 9, h);

    ctx.fillStyle = '#185c0e';
    ctx.fillRect(x + w - 6, y, 3, h);
  }

  drawPipeRim(x, y, w, h, isTop) {
    ctx.fillStyle = '#0f3d0a';
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = '#8de040';
    ctx.fillRect(x + 3, y + 3, 7, h - 6);

    ctx.fillStyle = '#4cb72e';
    ctx.fillRect(x + 10, y + 3, w - 26, h - 6);

    ctx.fillStyle = '#2d841b';
    ctx.fillRect(x + w - 16, y + 3, 10, h - 6);

    ctx.fillStyle = '#185c0e';
    ctx.fillRect(x + w - 6, y + 3, 3, h - 6);

    // Rivets
    ctx.fillStyle = '#0f3d0a';
    ctx.fillRect(x + 6, y + 6, 3, 3);
    ctx.fillRect(x + w - 9, y + 6, 3, 3);
    ctx.fillRect(x + 6, y + h - 9, 3, 3);
    ctx.fillRect(x + w - 9, y + h - 9, 3, 3);
  }

  drawFishes() {
    this.fishes.forEach(f => {
      if (f.collected) return;
      ctx.save();
      ctx.translate(f.x + f.w / 2, f.y + f.h / 2);

      const tailAngle = Math.sin(this.time * 16 + f.phase) * 0.25;

      let bodyColor = '#ff9f43';
      let finColor = '#ee5253';
      let bellyColor = '#fed330';
      let glowColor = 'rgba(255, 159, 67, 0.4)';

      if (f.type === 'fast') {
        bodyColor = '#0abde3';
        finColor = '#10ac84';
        bellyColor = '#c7ecee';
        glowColor = 'rgba(10, 189, 227, 0.5)';
      } else if (f.type === 'golden') {
        bodyColor = '#ffd32a';
        finColor = '#ffa801';
        bellyColor = '#ffffff';
        glowColor = 'rgba(255, 211, 42, 0.6)';
      } else if (f.type === 'rainbow') {
        bodyColor = `hsl(${(this.time * 240) % 360}, 100%, 65%)`;
        finColor = `hsl(${((this.time * 240) + 60) % 360}, 100%, 70%)`;
        bellyColor = '#ffffff';
        glowColor = `hsla(${(this.time * 240) % 360}, 100%, 65%, 0.7)`;
      }

      ctx.fillStyle = glowColor;
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();

      // Fish Body
      ctx.fillStyle = '#1e272e';
      ctx.fillRect(-10, -6, 18, 12);
      ctx.fillRect(-12, -4, 22, 8);
      ctx.fillRect(-14, -2, 24, 4);

      // Fish Fins
      ctx.save();
      ctx.rotate(tailAngle);
      ctx.fillStyle = finColor;
      ctx.fillRect(-13, -5, 5, 10);
      ctx.restore();

      // Scales & Belly
      ctx.fillStyle = bodyColor;
      ctx.fillRect(-8, -4, 14, 8);
      ctx.fillRect(-6, -5, 10, 10);

      ctx.fillStyle = bellyColor;
      ctx.fillRect(-6, 1, 10, 3);

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(2, -3, 4, 4);
      ctx.fillStyle = '#000000';
      ctx.fillRect(4, -2, 2, 2);

      // Specular Glint
      if (Math.sin(this.time * 8 + f.phase) > 0.6) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-2, -4, 2, 2);
      }

      ctx.restore();
    });
  }

  drawTrail() {
    if (this.trailHistory.length < 2) return;

    if (this.equippedTrail === 'rainbow' || this.rainbowFeverTimer > 0) {
      const colors = ['#ff0000', '#ff9900', '#ffff00', '#33cc33', '#0099ff', '#6633ff'];
      const ribbonH = 3;
      for (let c = 0; c < colors.length; c++) {
        ctx.fillStyle = colors[c];
        ctx.beginPath();
        for (let i = 0; i < this.trailHistory.length; i++) {
          const pt = this.trailHistory[i];
          const segY = pt.y + (c - 2.5) * ribbonH;
          if (i === 0) ctx.moveTo(pt.x, segY);
          else ctx.lineTo(pt.x - i * 1.5, segY);
        }
        ctx.lineWidth = ribbonH;
        ctx.strokeStyle = colors[c];
        ctx.stroke();
      }
    } else if (this.equippedTrail === 'hearts') {
      ctx.fillStyle = '#ff4757';
      for (let i = 0; i < this.trailHistory.length; i += 4) {
        const pt = this.trailHistory[i];
        const s = Math.max(2, 6 - i * 0.25);
        ctx.fillRect(pt.x - 6, pt.y - s / 2, s, s);
      }
    }
  }

  drawCat() {
    ctx.save();
    ctx.translate(this.cat.x + this.cat.w / 2, this.cat.y + this.cat.h / 2);
    ctx.rotate(this.cat.rot);

    // Draw 1:1 Pixel Cat Sprite
    const img = catImages[this.cat.frame] || catImages.f0;
    if (img && img.complete) {
      ctx.drawImage(img, -this.cat.w / 2, -this.cat.h / 2, this.cat.w, this.cat.h);
    }

    // Draw Equipped Hat
    this.drawHat();

    // Draw Meow / Eating Speech Bubble
    if (this.cat.meowBubbleTimer > 0) {
      this.cat.meowBubbleTimer -= 0.016;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(18, -26, 26, 14);
      ctx.fillStyle = '#000000';
      ctx.font = '7px monospace';
      ctx.fillText('MEOW', 20, -16);
    }

    // Draw Dizzy Eyes if Game Over
    if (this.state === 'GAMEOVER') {
      ctx.fillStyle = '#000';
      ctx.font = '8px monospace';
      ctx.fillText('X', 18, -6);
    }

    ctx.restore();
  }

  drawHat() {
    if (this.equippedHat === 'none') return;
    const hx = 10;
    const hy = -18;

    if (this.equippedHat === 'chef') {
      ctx.fillStyle = '#000';
      ctx.fillRect(hx - 1, hy - 1, 16, 12);
      ctx.fillStyle = '#fff';
      ctx.fillRect(hx, hy, 14, 10);
      ctx.fillStyle = '#dcdde1';
      ctx.fillRect(hx + 2, hy + 2, 10, 4);
    } else if (this.equippedHat === 'crown') {
      ctx.fillStyle = '#d6980d';
      ctx.fillRect(hx - 1, hy + 2, 16, 8);
      ctx.fillStyle = '#fbc531';
      ctx.fillRect(hx, hy + 3, 14, 6);
      ctx.fillStyle = '#e84118';
      ctx.fillRect(hx + 2, hy + 5, 2, 2);
      ctx.fillRect(hx + 6, hy + 5, 2, 2);
      ctx.fillRect(hx + 10, hy + 5, 2, 2);
    } else if (this.equippedHat === 'party') {
      ctx.fillStyle = '#e84118';
      ctx.beginPath();
      ctx.moveTo(hx + 7, hy - 4);
      ctx.lineTo(hx, hy + 8);
      ctx.lineTo(hx + 14, hy + 8);
      ctx.fill();
      ctx.fillStyle = '#fbc531';
      ctx.fillRect(hx + 6, hy - 6, 3, 3);
    } else if (this.equippedHat === 'shades') {
      ctx.fillStyle = '#111';
      ctx.fillRect(hx + 6, hy + 12, 16, 5);
      ctx.fillStyle = '#fff';
      ctx.fillRect(hx + 8, hy + 13, 2, 2);
      ctx.fillRect(hx + 16, hy + 13, 2, 2);
    } else if (this.equippedHat === 'pirate') {
      ctx.fillStyle = '#2f3640';
      ctx.fillRect(hx - 2, hy + 3, 18, 6);
      ctx.fillRect(hx + 1, hy - 1, 12, 5);
      ctx.fillStyle = '#f5f6fa';
      ctx.fillRect(hx + 6, hy + 2, 3, 2);
    } else if (this.equippedHat === 'halo') {
      ctx.strokeStyle = '#fbc531';
      ctx.lineWidth = 2;
      ctx.strokeRect(hx - 2, hy - 8, 18, 4);
    }
  }

  drawGround() {
    const gy = this.height - this.groundHeight;

    ctx.fillStyle = '#2ed573';
    ctx.fillRect(0, gy, this.width, 14);

    ctx.fillStyle = '#26af5f';
    for (let x = -this.groundOffset; x < this.width + 24; x += 12) {
      ctx.fillRect(x, gy + 8, 6, 6);
    }

    ctx.fillStyle = '#834c24';
    ctx.fillRect(0, gy + 14, this.width, this.groundHeight - 14);

    ctx.fillStyle = '#653a1b';
    for (let x = -this.groundOffset; x < this.width + 24; x += 24) {
      ctx.fillRect(x + 4, gy + 22, 6, 6);
      ctx.fillRect(x + 16, gy + 42, 8, 5);
      ctx.fillRect(x + 8, gy + 58, 7, 6);
    }
    ctx.fillStyle = '#a56332';
    for (let x = -this.groundOffset; x < this.width + 24; x += 24) {
      ctx.fillRect(x + 10, gy + 32, 5, 4);
      ctx.fillRect(x + 2, gy + 48, 6, 5);
    }
  }

  drawParticles() {
    this.particles.forEach(p => {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;

      if (p.type === 'heart') {
        ctx.font = `${p.size * 1.5}px monospace`;
        ctx.fillText('❤️', p.x, p.y);
      } else if (p.type === 'bubble') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(p.x, p.y, p.size, p.size);
      } else {
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.restore();
    });
  }

  drawFloatingTexts() {
    this.floatingTexts.forEach(t => {
      const alpha = Math.max(0, t.life / t.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillStyle = '#000000';
      ctx.fillText(t.text, t.x + 1, t.y + 1);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    });
  }

  drawUI() {
    if (this.state === 'PLAYING') {
      ctx.save();
      ctx.font = '22px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000';
      ctx.fillText(this.score.toString(), this.width / 2 + 2, 82);
      ctx.fillStyle = '#fff';
      ctx.fillText(this.score.toString(), this.width / 2, 80);
      ctx.restore();
    } else if (this.state === 'MENU') {
      ctx.save();
      ctx.textAlign = 'center';
      
      // Game Logo Title: MIELE THE CAT
      ctx.font = '18px "Press Start 2P", monospace';
      ctx.fillStyle = '#000';
      ctx.fillText('MIELE THE CAT', this.width / 2 + 2, 162);
      ctx.fillStyle = '#fbc531';
      ctx.fillText('MIELE THE CAT', this.width / 2, 160);

      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillStyle = '#fff';
      ctx.fillText('PIXEL ADVENTURE', this.width / 2, 185);

      const pulse = Math.sin(this.time * 6) > 0;
      if (pulse) {
        ctx.font = '11px "Press Start 2P", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('TAP OR SPACE TO FLY', this.width / 2, 420);
      }

      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillStyle = '#1e272e';
      ctx.fillText(`BEST SCORE: ${this.bestScore}`, this.width / 2 + 1, 481);
      ctx.fillStyle = '#ffd32a';
      ctx.fillText(`BEST SCORE: ${this.bestScore}`, this.width / 2, 480);

      ctx.font = '8px "Press Start 2P", monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Help Miele catch delicious 🐟!', this.width / 2, 510);
      ctx.fillText('[M] Meow  [P] Pause', this.width / 2, 530);

      ctx.restore();
    } else if (this.state === 'PAUSED') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, this.width, this.height);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '18px "Press Start 2P", monospace';
      ctx.fillStyle = '#ffd32a';
      ctx.fillText('PAUSED', this.width / 2, 280);
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillStyle = '#fff';
      ctx.fillText('PRESS P OR TAP TO RESUME', this.width / 2, 320);
      ctx.restore();
    } else if (this.state === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillRect(0, 0, this.width, this.height);

      ctx.save();
      ctx.textAlign = 'center';

      ctx.font = '18px "Press Start 2P", monospace';
      ctx.fillStyle = '#ff4757';
      ctx.fillText('GAME OVER', this.width / 2, 170);

      // Scoreboard Card
      const cardX = 35;
      const cardY = 195;
      const cardW = this.width - 70;
      const cardH = 190;

      ctx.fillStyle = '#0f1420';
      ctx.fillRect(cardX, cardY, cardW, cardH);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#54a0ff';
      ctx.strokeRect(cardX, cardY, cardW, cardH);

      // Score & Best
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillStyle = '#aaa';
      ctx.fillText('SCORE', this.width / 2, cardY + 30);
      ctx.font = '16px "Press Start 2P", monospace';
      ctx.fillStyle = '#fff';
      ctx.fillText(this.score.toString(), this.width / 2, cardY + 52);

      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillStyle = '#aaa';
      ctx.fillText('BEST SCORE', this.width / 2, cardY + 80);
      ctx.font = '14px "Press Start 2P", monospace';
      ctx.fillStyle = '#ffd32a';
      ctx.fillText(this.bestScore.toString(), this.width / 2, cardY + 98);

      // Fishes Collected
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillStyle = '#00d2d3';
      ctx.fillText(`+${this.fishesThisRun} 🐟 COLLECTED`, this.width / 2, cardY + 125);

      // Medal
      if (this.medalAwarded) {
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#ff9ff3';
        ctx.fillText(`MEDAL: ${this.medalAwarded}`, this.width / 2, cardY + 155);
      }

      const pulse = Math.sin(this.time * 6) > 0;
      if (pulse) {
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('TAP OR SPACE TO PLAY AGAIN', this.width / 2, 430);
      }

      ctx.restore();
    }
  }

  // Shop Logic
  openShop() {
    if (this.state === 'PLAYING') this.togglePause();
    document.getElementById('shop-modal').classList.add('active');
    this.renderShopItems();
  }

  closeShop() {
    document.getElementById('shop-modal').classList.remove('active');
  }

  setupShop() {}

  renderShopItems() {
    const container = document.getElementById('shop-items-container');
    container.innerHTML = '';
    
    document.getElementById('tab-hats').className = 'shop-tab' + (this.activeShopTab === 'hats' ? ' active' : '');
    document.getElementById('tab-trails').className = 'shop-tab' + (this.activeShopTab === 'trails' ? ' active' : '');

    const items = SHOP_DATA[this.activeShopTab];
    const prefix = this.activeShopTab === 'hats' ? 'hat_' : 'trail_';
    const equippedId = this.activeShopTab === 'hats' ? this.equippedHat : this.equippedTrail;

    items.forEach(item => {
      const isUnlocked = this.unlockedItems.includes(prefix + item.id) || item.cost === 0;
      const isEquipped = equippedId === item.id;

      const card = document.createElement('div');
      card.className = 'shop-item' + (isEquipped ? ' equipped' : '');
      card.innerHTML = `
        <div class="item-name">${item.name}</div>
        <div class="item-icon">${item.icon}</div>
        <div class="item-cost">${item.cost > 0 ? item.cost + ' 🐟' : 'FREE'}</div>
        <button class="item-btn ${isEquipped ? 'equipped' : (isUnlocked ? 'equip' : 'buy')}">
          ${isEquipped ? 'EQUIPPED' : (isUnlocked ? 'EQUIP' : 'BUY')}
        </button>
      `;

      const btn = card.querySelector('.item-btn');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        audio.ensureContext();
        if (isEquipped) return;
        if (isUnlocked) {
          if (this.activeShopTab === 'hats') this.equippedHat = item.id;
          else this.equippedTrail = item.id;
          audio.playTone(600, 'triangle', 0.1, 0.2, 0.01, 900);
          this.saveData();
          this.renderShopItems();
        } else {
          if (this.fishCount >= item.cost) {
            this.fishCount -= item.cost;
            this.unlockedItems.push(prefix + item.id);
            if (this.activeShopTab === 'hats') this.equippedHat = item.id;
            else this.equippedTrail = item.id;
            audio.playFish('golden');
            this.updateHUD();
            this.saveData();
            this.renderShopItems();
          } else {
            audio.playHit();
            alert(`Need ${item.cost - this.fishCount} more fishes! 🐟`);
          }
        }
      });

      container.appendChild(card);
    });
  }
}

// Start Game Loop
const game = new FlappyCatGame();
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;

  game.update(dt);
  game.render();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
